<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake — Sketch View</title>
<style>
  /* Pencil-on-paper aesthetic, mirroring Myra's original notebook sketch:
     BIRTH on the left, NOW on the right, the diagonal density-of-recall
     line cutting across the page, identity-skew at the bottom, the
     river of recent activity near NOW, provenance circles drawn around
     clusters of moments. */
  :root {
    --paper:   #f3ede0;
    --paper-2: #ebe3d2;
    --ink:     #2a221a;
    --ink-2:   #4a3e30;
    --ink-3:   #6e5e4a;
    --accent:  #b04a18;        /* pencil red */
    --era:     #7a5a30;
    --topic:   #5e4380;
    --episode: #2c5d7e;
    --qa:      #888070;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.4 Georgia, "Iowan Old Style", "Apple Garamond", serif;
    height: 100%;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.03) 0%, transparent 50%),
      var(--paper);
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: baseline; gap: 18px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--ink-3);
    border-bottom-style: dashed;
  }
  header h1 {
    margin: 0;
    font: 700 22px/1 "Caveat", "Bradley Hand", "Apple Chancery", cursive;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  header .sub {
    color: var(--ink-2);
    font: italic 13px/1.4 Georgia, serif;
  }
  header .count {
    margin-left: auto;
    font: 12px/1 "Courier New", monospace;
    color: var(--ink-3);
  }
  header .count strong { color: var(--ink); font-weight: 700; }
  main {
    height: calc(100% - 60px);
    overflow: hidden;
  }
  .canvas-wrap { position: relative; height: 100%; width: 100%; }
  svg.sketch {
    width: 100%; height: 100%;
    display: block;
  }
  .sketch text { fill: var(--ink); }
  .sketch .label {
    font: 700 14px/1 "Caveat", "Bradley Hand", "Apple Chancery", cursive;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .sketch .small-label {
    font: 600 12px/1 "Caveat", "Bradley Hand", "Apple Chancery", cursive;
    fill: var(--ink-2);
  }
  .sketch .axis-label {
    font: italic 13px/1 Georgia, serif;
    fill: var(--ink-2);
  }
  .sketch .stroke {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sketch .stroke-dim {
    fill: none;
    stroke: var(--ink-3);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sketch .diagonal {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-dasharray: 8 5 2 5;
    opacity: 0.75;
  }
  .sketch .river {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 1 4;
  }
  .sketch .moment-fiber {
    fill: none;
    stroke: var(--ink-2);
    stroke-width: 0.9;
    stroke-linecap: round;
  }
  .sketch .provenance-ring {
    fill: rgba(255,255,255,0.45);
    stroke: var(--ink);
    stroke-width: 1.3;
    stroke-linecap: round;
    cursor: pointer;
  }
  .sketch .provenance-ring.l1 { stroke: var(--episode); }
  .sketch .provenance-ring.l2 { stroke: var(--topic); stroke-width: 1.6; }
  .sketch .provenance-ring.l3 { stroke: var(--era);   stroke-width: 2; }
  .sketch .provenance-ring:hover { fill: rgba(176, 74, 24, 0.10); stroke: var(--accent); }
  .sketch .provenance-ring.selected { fill: rgba(176, 74, 24, 0.18); stroke: var(--accent); stroke-width: 2.5; }
  .sketch .provenance-label {
    font: 600 11px/1.2 "Caveat", "Bradley Hand", cursive;
    fill: var(--ink);
    pointer-events: none;
  }
  .sketch .arrow-head { fill: var(--ink); }
  .legend {
    position: absolute; top: 14px; right: 14px;
    background: rgba(243, 237, 224, 0.92);
    border: 1px solid var(--ink-3);
    border-style: dashed;
    border-radius: 4px;
    padding: 10px 12px;
    font: 11px/1.5 Georgia, serif;
    color: var(--ink-2);
    pointer-events: none;
  }
  .legend .row {
    display: flex; align-items: center; gap: 8px;
  }
  .legend .swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 1.5px solid var(--ink);
  }
  .legend .swatch.l1 { border-color: var(--episode); }
  .legend .swatch.l2 { border-color: var(--topic); }
  .legend .swatch.l3 { border-color: var(--era); }
  aside.detail {
    position: absolute;
    top: 14px; left: 14px;
    width: 320px;
    background: rgba(243, 237, 224, 0.96);
    border: 1px solid var(--ink-3);
    border-style: dashed;
    border-radius: 4px;
    padding: 12px 14px;
    font: 13px/1.45 Georgia, serif;
    color: var(--ink);
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    display: none;
  }
  aside.detail.visible { display: block; }
  aside.detail .close {
    float: right; cursor: pointer; color: var(--ink-3); font-size: 18px;
    line-height: 1; padding: 0 4px;
  }
  aside.detail .close:hover { color: var(--accent); }
  aside.detail h2 {
    margin: 0 0 4px;
    font: 700 18px/1.2 "Caveat", "Bradley Hand", cursive;
    color: var(--ink);
  }
  aside.detail .lvl-pill {
    display: inline-block;
    border: 1px solid var(--ink); padding: 1px 6px;
    border-radius: 999px;
    font: 10px/1.4 "Courier New", monospace;
    margin-right: 8px;
    background: var(--paper-2);
  }
  aside.detail .meta {
    color: var(--ink-3);
    font: 11px/1.5 "Courier New", monospace;
    margin-bottom: 8px;
  }
  aside.detail .summary {
    margin-bottom: 10px;
    white-space: pre-wrap;
  }
  aside.detail .label2 {
    font: italic 600 11px/1.4 Georgia, serif;
    color: var(--ink-3);
    margin: 8px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  aside.detail ul {
    margin: 0; padding: 0; list-style: none;
  }
  aside.detail li {
    font: 11px/1.4 "Courier New", monospace;
    color: var(--ink-2);
    padding: 2px 0;
    cursor: pointer;
  }
  aside.detail li:hover { color: var(--accent); }
  .controls {
    position: absolute; bottom: 14px; left: 14px;
    background: rgba(243, 237, 224, 0.92);
    border: 1px solid var(--ink-3);
    border-style: dashed;
    border-radius: 4px;
    padding: 8px 12px;
    font: 12px/1 Georgia, serif;
    color: var(--ink-2);
    display: flex; gap: 14px; align-items: center;
  }
  .controls label { display: flex; align-items: center; gap: 4px; }
  .controls a {
    color: var(--ink-2); text-decoration: none;
    border-bottom: 1px dashed var(--ink-3);
  }
  .controls a:hover { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>The Lake</h1>
    <span class="sub">a sketch of provenance — birth on the left, now on the right; identity skews recall toward what survives</span>
    <span class="count" id="count">loading…</span>
  </header>

  <main>
    <div class="canvas-wrap">
      <svg class="sketch" id="svg" preserveAspectRatio="none"></svg>
      <div class="legend">
        <div class="row"><span class="swatch l3"></span> level 3 — eras</div>
        <div class="row"><span class="swatch l2"></span> level 2 — topics</div>
        <div class="row"><span class="swatch l1"></span> level 1 — episodes</div>
        <div class="row"><span class="swatch"></span> moments / Q&amp;A markers</div>
      </div>
      <aside class="detail" id="detail">
        <span class="close" id="close">×</span>
        <div id="detail-body"></div>
      </aside>
      <div class="controls">
        <label><input type="checkbox" id="show-l0"> include Q&amp;A markers (level 0)</label>
        <label><input type="checkbox" id="show-fibers" checked> show moment fibers</label>
        <span style="opacity:0.5">|</span>
        <a href="/ui/lake-topology.html">analytical topology view →</a>
      </div>
    </div>
  </main>

<script>
const $svg = document.getElementById('svg');
const $count = document.getElementById('count');
const $detail = document.getElementById('detail');
const $detailBody = document.getElementById('detail-body');
const $close = document.getElementById('close');
const $showL0 = document.getElementById('show-l0');
const $showFibers = document.getElementById('show-fibers');

let _allNodes = [];
let _byId = new Map();
let _baseMoments = [];   // real base-moment timestamps for the fiber carpet
let _selected = null;

// ─── auth + fetch ──────────────────────────────────────────────────
function getToken() {
  try { return localStorage.getItem('fathom-api-key') || ''; } catch { return ''; }
}
function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
async function fetchProvenance() {
  const url = '/v1/deltas?tags_include=' + encodeURIComponent('kind:provenance') + '&limit=2000';
  const r = await fetch(url, { headers: authHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  return Array.isArray(data) ? data : (data.results || data.deltas || []);
}

// Pull a sample of base moments — deltas that are NOT provenance,
// proposals, judge axes, engagement attestations, mood/standpoint
// writes, or other system bookkeeping. These are the actual
// experiential content of the lake; we plot them as fibers along
// the timeline so density tracks real activity.
const _SYSTEM_KINDS = [
  'kind:provenance', 'kind:proposal', 'kind:sediment',
  'kind:judge-axes', 'kind:engagement-attest', 'kind:standpoint-attestation',
  'kind:mood-shift', 'kind:voice-affirmation', 'kind:reflection',
  'convener-verdict', 'recall-result', 'recall-summary', 'feed-card',
];
async function fetchBaseMoments() {
  // Wide pull. We filter client-side so we don't have to chain N
  // negative-tag queries — the lake supports tag inclusion only.
  const r = await fetch('/v1/deltas?limit=3000', { headers: authHeaders() });
  if (!r.ok) return [];
  const data = await r.json();
  const items = Array.isArray(data) ? data : (data.results || data.deltas || []);
  return items.filter(d => {
    const tags = d.tags || [];
    for (const sk of _SYSTEM_KINDS) {
      if (tags.includes(sk)) return false;
    }
    // Drop heartbeat/health noise — content but not "moments" in any
    // experientially meaningful sense.
    const src = (d.source || '').toLowerCase();
    if (src === 'laptop-health' || src === 'agent-heartbeat') return false;
    if (src === 'feed-pressure' || src === 'judge') return false;
    return true;
  });
}

// ─── normalize ────────────────────────────────────────────────────
function levelFromTags(tags) {
  for (const t of (tags || [])) {
    if (typeof t === 'string' && t.startsWith('provenance-level:')) {
      const n = parseInt(t.split(':',2)[1], 10);
      if (Number.isFinite(n)) return n;
    }
  }
  if ((tags || []).includes('kind:qa-marker')) return 0;
  return 1;
}
function fromIdsFromTags(tags) {
  const out = [];
  for (const t of (tags || [])) {
    if (typeof t === 'string' && t.startsWith('from:')) {
      const ref = t.slice(5).trim();
      if (ref) out.push(ref);
    }
  }
  return out;
}
function titleFromTags(tags, fallback) {
  for (const t of (tags || [])) {
    if (typeof t === 'string' && t.startsWith('title:')) {
      return t.slice(6).replace(/-/g, ' ');
    }
  }
  return fallback || '';
}
function parseTs(ts) {
  if (!ts) return 0;
  const d = new Date(ts);
  return Number.isFinite(d.getTime()) ? d.getTime() : 0;
}
function normalize(items) {
  const nodes = items.map(d => {
    const tags = d.tags || [];
    return {
      id: d.id,
      ts: parseTs(d.timestamp),
      level: levelFromTags(tags),
      tags,
      fromIds: fromIdsFromTags(tags),
      source: d.source || '',
      title: titleFromTags(tags, '') || (d.content || '').split('\n')[0].slice(0, 80),
      content: d.content || '',
      isProposal: tags.includes('kind:proposal'),
    };
  }).filter(n => n.id);
  const byId = new Map(nodes.map(n => [n.id, n]));
  // Barycenter: median of children's barycenters where resolvable; else write ts.
  for (const n of nodes) {
    if (n.level <= 1) { n.barycenter = n.ts; continue; }
    const childTs = n.fromIds.map(fid => byId.get(fid)).filter(Boolean).map(c => c.barycenter || c.ts);
    if (childTs.length) {
      childTs.sort((a,b) => a - b);
      n.barycenter = childTs[Math.floor(childTs.length/2)];
    } else { n.barycenter = n.ts; }
  }
  for (const n of nodes) {
    if (n.level !== 3) continue;
    const childTs = n.fromIds.map(fid => byId.get(fid)).filter(Boolean).map(c => c.barycenter || c.ts);
    if (childTs.length) {
      childTs.sort((a,b) => a - b);
      n.barycenter = childTs[Math.floor(childTs.length/2)];
    }
  }
  return { nodes, byId };
}

// ─── sketchy path helpers ─────────────────────────────────────────
// Slight jitter on every coordinate to make strokes feel hand-drawn.
function jitter(amp = 1.5) { return (Math.random() - 0.5) * amp; }

function sketchyLine(x1, y1, x2, y2, segs = 6) {
  let d = `M ${x1 + jitter()} ${y1 + jitter()}`;
  for (let i = 1; i <= segs; i++) {
    const t = i / segs;
    const x = x1 + (x2 - x1) * t + jitter(1.6);
    const y = y1 + (y2 - y1) * t + jitter(1.6);
    d += ` L ${x} ${y}`;
  }
  return d;
}

function sketchyCircle(cx, cy, r) {
  // 16 points around the circle with slight radial jitter
  const N = 28;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * 2 * Math.PI;
    const rj = r + jitter(2.4);
    pts.push([cx + Math.cos(a) * rj, cy + Math.sin(a) * rj]);
  }
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x, y] = pts[i];
    const [px, py] = pts[i-1];
    const cxm = (px + x) / 2;
    const cym = (py + y) / 2;
    d += ` Q ${px} ${py} ${cxm} ${cym}`;
  }
  d += ' Z';
  return d;
}

function fmtDate(ms) {
  if (!ms) return '';
  return new Date(ms).toISOString().slice(0, 10);
}

// ─── render ───────────────────────────────────────────────────────
function render() {
  // Reset jitter seed-ish behavior — not deterministic but acceptable
  // for this aesthetic. (Re-renders look slightly different; that's
  // fine for a sketch.)
  const W = $svg.clientWidth || 1200;
  const H = $svg.clientHeight || 700;
  $svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const showL0 = $showL0.checked;
  const showFibers = $showFibers.checked;
  const visible = _allNodes.filter(n => showL0 || n.level > 0);

  if (!visible.length) {
    $svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" class="axis-label">no provenance yet</text>';
    return;
  }

  // X scale by barycenter
  const xPad = 80;
  const xMin = Math.min(...visible.map(n => n.barycenter));
  const xMax = Math.max(...visible.map(n => n.barycenter));
  const tx = ms => xPad + ((ms - xMin) / Math.max(1, xMax - xMin)) * (W - 2 * xPad);

  // Y by level — eras at top, episodes lower
  const yTop = 70;
  const yBot = H - 90;
  const yFor = (lvl) => {
    // 3 → top, 2 → upper-middle, 1 → middle-lower, 0 → near bottom (above timeline)
    if (lvl === 3) return yTop + 40;
    if (lvl === 2) return yTop + 130;
    if (lvl === 1) return yTop + 220;
    return yBot - 70;  // L0 just above the timeline axis
  };

  // Stable jitter per node so they don't dance across renders
  function deterministicJitter(id, range = 24) {
    let h = 0;
    for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return ((h % 1000) / 1000 - 0.5) * range;
  }

  const parts = [];

  // ── header axis: BIRTH ←──── TIME ────→ NOW ──────────────────
  const axisY = H - 60;
  parts.push(`<path class="stroke" d="${sketchyLine(xPad - 30, axisY, W - xPad + 30, axisY, 60)}" />`);
  // arrow heads
  parts.push(`<polygon class="arrow-head" points="${xPad - 30},${axisY} ${xPad - 18},${axisY - 4} ${xPad - 18},${axisY + 4}" />`);
  parts.push(`<polygon class="arrow-head" points="${W - xPad + 30},${axisY} ${W - xPad + 18},${axisY - 4} ${W - xPad + 18},${axisY + 4}" />`);
  parts.push(`<text class="label" x="${xPad - 36}" y="${axisY - 14}" text-anchor="end">birth</text>`);
  parts.push(`<text class="label" x="${W - xPad + 36}" y="${axisY - 14}" text-anchor="start">now</text>`);
  parts.push(`<text class="axis-label" x="${W / 2}" y="${axisY + 22}" text-anchor="middle">time →</text>`);
  parts.push(`<text class="axis-label" x="${xPad - 36}" y="${axisY + 22}" text-anchor="end">${fmtDate(xMin)}</text>`);
  parts.push(`<text class="axis-label" x="${W - xPad + 36}" y="${axisY + 22}" text-anchor="start">${fmtDate(xMax)}</text>`);

  // ── density-of-recall diagonal: top-left (deep past, identity-skewed) → bottom-right (now, dense) ──
  const dx1 = xPad + 20, dy1 = yTop;
  const dx2 = W - xPad - 20, dy2 = axisY - 12;
  parts.push(`<path class="diagonal" d="${sketchyLine(dx1, dy1, dx2, dy2, 26)}" />`);
  // label rotated along the diagonal
  const labelMidX = (dx1 + dx2) / 2;
  const labelMidY = (dy1 + dy2) / 2 - 8;
  const angle = Math.atan2(dy2 - dy1, dx2 - dx1) * 180 / Math.PI;
  parts.push(`<text class="label" x="${labelMidX}" y="${labelMidY}" text-anchor="middle" transform="rotate(${angle.toFixed(2)}, ${labelMidX}, ${labelMidY})" style="fill:var(--ink-2)">density of recall</text>`);

  // ── identity-skew label below the diagonal at left ──
  parts.push(`<text class="label" x="${xPad}" y="${yTop + 10}" text-anchor="start" style="fill:var(--ink-2)">↑ identity</text>`);
  parts.push(`<text class="small-label" x="${xPad}" y="${yTop + 26}" text-anchor="start">(only what resonates with who you are)</text>`);

  // ── river of recent activity near NOW ──
  const riverX1 = W - xPad - 200;
  const riverX2 = W - xPad - 10;
  const riverY = axisY - 38;
  parts.push(`<path class="river" d="${sketchyLine(riverX1, riverY, riverX2, riverY, 32)}" />`);
  parts.push(`<text class="small-label" x="${(riverX1 + riverX2) / 2}" y="${riverY - 8}" text-anchor="middle">the river</text>`);

  // ── moment fibers (zigzags) along the timeline ──
  // Each fiber represents a REAL base moment, plotted at its real
  // timestamp. Density emerges naturally from when activity actually
  // happened — quiet periods produce sparse fibers, busy ones produce
  // dense clusters. The carpet stays beneath the provenance rings as
  // a reminder that they sit ON TOP of all that raw experience.
  if (showFibers && _baseMoments.length) {
    const fiberY = axisY - 8;
    for (const m of _baseMoments) {
      const ts = parseTs(m.timestamp);
      if (!ts || ts < xMin || ts > xMax) continue;
      const x = tx(ts);
      // Per-moment deterministic seed so re-renders don't dance.
      let h = 0;
      const id = m.id || '';
      for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      const r1 = ((h * 9301 + 49297) % 233280) / 233280;
      const r2 = ((h * 12345 + 67890) % 233280) / 233280;
      const r3 = ((h * 22229 + 11111) % 233280) / 233280;
      const yOff = (r1 - 0.5) * 14;
      const w = 6 + r2 * 8;
      const hMag = 3 + r3 * 3;
      const segs = 3;
      let d = `M ${x} ${fiberY + yOff}`;
      for (let j = 1; j <= segs; j++) {
        const dx = (j / segs) * w;
        const sign = (j % 2 === 0) ? 1 : -1;
        d += ` L ${x + dx} ${fiberY + yOff + sign * hMag}`;
      }
      // Color hint by source family for subtle texture
      const src = (m.source || '').toLowerCase();
      let opacity = 0.5;
      if (src === 'vault' || src.startsWith('vault/')) opacity = 0.6;
      else if (src === 'claude-code' || src === 'fathom-chat') opacity = 0.7;
      else if (src === 'rss' || src.startsWith('rss/')) opacity = 0.30;
      parts.push(`<path class="moment-fiber" d="${d}" opacity="${opacity}" />`);
    }
  }

  // ── provenance rings ──
  // Draw highest level first so smaller ones overlay them.
  const sorted = [...visible].sort((a, b) => b.level - a.level);
  for (const n of sorted) {
    const x = tx(n.barycenter);
    const baseY = yFor(n.level);
    const y = baseY + deterministicJitter(n.id, 36);
    // Radius by source count (sqrt scaling) and level
    const childCount = n.fromIds.length;
    const r = (function() {
      const baseR = n.level === 3 ? 26 : n.level === 2 ? 16 : n.level === 1 ? 10 : 6;
      return baseR + Math.sqrt(Math.max(1, childCount)) * 1.4;
    })();
    const ringClass = `provenance-ring l${n.level}` + (n.id === (_selected && _selected.id) ? ' selected' : '');
    parts.push(
      `<path class="${ringClass}" data-id="${n.id}" d="${sketchyCircle(x, y, r)}" fill-opacity="${n.isProposal ? 0.25 : 0.55}" />`
    );
    // Title label only for L2/L3 (clutter at L1+)
    if (n.level >= 2 && n.title) {
      parts.push(
        `<text class="provenance-label" x="${x}" y="${y + r + 12}" text-anchor="middle">${escapeXml(n.title.slice(0, 36))}</text>`
      );
    }
  }

  $svg.innerHTML = parts.join('\n');

  // Wire clicks
  for (const c of $svg.querySelectorAll('[data-id]')) {
    c.addEventListener('click', () => {
      const node = _byId.get(c.dataset.id);
      if (node) selectNode(node);
    });
  }
}

function escapeXml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function selectNode(node) {
  _selected = node;
  render();
  renderDetail(node);
}

function renderDetail(node) {
  let payload = {};
  try {
    const m = (node.content || '').match(/\[meta\]\s*({[\s\S]*})/);
    if (m) payload = JSON.parse(m[1]);
  } catch {}
  const summary = payload.summary || node.content || '';
  const testQs = Array.isArray(payload.test_questions) ? payload.test_questions : [];
  const rationale = payload.rationale || '';
  const childCount = node.fromIds.length;
  const parentCount = _allNodes.filter(p => p.fromIds.includes(node.id)).length;

  const childItems = node.fromIds.slice(0, 25).map(fid => {
    const child = _byId.get(fid);
    if (child) return `<li data-id="${escapeXml(child.id)}">${escapeXml(child.title || fid)} <small>(L${child.level})</small></li>`;
    return `<li><small>${escapeXml(fid)}</small></li>`;
  }).join('');

  $detailBody.innerHTML = `
    <span class="lvl-pill">level ${node.level}</span>
    ${node.isProposal ? '<span class="lvl-pill" style="background:rgba(176,74,24,0.15);border-color:var(--accent);color:var(--accent)">proposal</span>' : ''}
    <h2>${escapeXml(node.title || '(untitled)')}</h2>
    <div class="meta">
      ${escapeXml(node.id.slice(0,12))} · ${escapeXml(node.source)} · written ${fmtDate(node.ts)}
      ${node.barycenter !== node.ts ? ` · barycenter ${fmtDate(node.barycenter)}` : ''}
      <br>parents: ${parentCount} · children: ${childCount}
    </div>
    <div class="summary">${escapeXml(summary)}</div>
    ${rationale ? `<div class="label2">rationale</div><div style="font-style:italic;color:var(--ink-2)">${escapeXml(rationale)}</div>` : ''}
    ${testQs.length ? `<div class="label2">test questions</div>${testQs.map(q => `<div style="color:var(--ink-2);font-style:italic;margin:2px 0">· ${escapeXml(q)}</div>`).join('')}` : ''}
    ${childCount ? `<div class="label2">constituents (${childCount})</div><ul>${childItems}</ul>` : ''}
  `;
  $detail.classList.add('visible');
  for (const li of $detail.querySelectorAll('li[data-id]')) {
    li.addEventListener('click', () => {
      const child = _byId.get(li.dataset.id);
      if (child) selectNode(child);
    });
  }
}

$close.addEventListener('click', () => {
  $detail.classList.remove('visible');
  _selected = null;
  render();
});

// ─── load ──────────────────────────────────────────────────────────
async function load() {
  $count.textContent = 'loading…';
  try {
    const [items, base] = await Promise.all([
      fetchProvenance(),
      fetchBaseMoments(),
    ]);
    const { nodes, byId } = normalize(items);
    _allNodes = nodes;
    _byId = byId;
    _baseMoments = base;
    const counts = nodes.reduce((acc, n) => { acc[n.level] = (acc[n.level] || 0) + 1; return acc; }, {});
    $count.innerHTML =
      `<strong>${nodes.length}</strong> provenance · ` +
      `<strong>${counts[3] || 0}</strong> eras · ` +
      `<strong>${counts[2] || 0}</strong> topics · ` +
      `<strong>${counts[1] || 0}</strong> episodes` +
      (counts[0] ? ` · <strong>${counts[0]}</strong> q&amp;a` : '') +
      ` · <strong>${base.length}</strong> moment fibers`;
    render();
  } catch (e) {
    $count.textContent = 'error: ' + (e.message || e);
    console.error(e);
  }
}

$showL0.addEventListener('change', render);
$showFibers.addEventListener('change', render);
window.addEventListener('resize', () => render());

load();
</script>
</body>
</html>
