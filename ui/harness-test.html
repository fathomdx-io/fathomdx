<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Test — Fathom</title>
<style>
  :root {
    --bg: #0d0e10;
    --surface: #15171b;
    --surface-2: #1c1f24;
    --border: #2a2e36;
    --text: #e6e9ee;
    --text-dim: #8a93a0;
    --accent: #ffa552;
    --ok: #6ed089;
    --err: #e57373;
    --tool-search: #6ec1e4;
    --tool-expand: #b487e8;
    --tool-ascend: #f0c674;
    --tool-deliberate: #ffa552;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase;
  }
  header .sub {
    color: var(--text-dim); font-size: 12px;
  }
  .composer {
    display: flex; gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .composer input {
    flex: 1;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    border-radius: 4px;
  }
  .composer input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .composer button {
    padding: 10px 18px;
    background: var(--accent);
    color: #1a0d00;
    border: none;
    font: 600 14px/1 system-ui, sans-serif;
    border-radius: 4px;
    cursor: pointer;
  }
  .composer button:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  main {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 18px;
  }
  .empty {
    text-align: center; color: var(--text-dim);
    padding: 60px 20px;
    font-size: 13px;
  }
  .event {
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .event-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--surface-2);
    font: 600 12px/1 var(--mono);
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .event-header .badge {
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--border);
    color: var(--text);
  }
  .event-header .badge.tool-search     { background: var(--tool-search); color: #042033; }
  .event-header .badge.tool-expand     { background: var(--tool-expand); color: #1a0a3a; }
  .event-header .badge.tool-ascend     { background: var(--tool-ascend); color: #2a1f00; }
  .event-header .badge.tool-deliberate { background: var(--tool-deliberate); color: #1a0d00; }
  .event-header .badge.respond         { background: var(--ok); color: #002b0d; }
  .event-header .badge.error           { background: var(--err); color: #2b0500; }
  .event-header .turn { color: var(--accent); }
  .event-header time { margin-left: auto; font-weight: 400; color: var(--text-dim); }
  .event-body {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.55;
  }
  .event-body pre {
    margin: 0;
    font: 12px/1.5 var(--mono);
    color: var(--text);
    background: var(--bg);
    padding: 10px;
    border-radius: 3px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .thinking {
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 6px;
  }
  .args {
    color: var(--accent);
    font: 12px/1.5 var(--mono);
    margin-bottom: 6px;
  }
  .card {
    background: var(--surface-2);
    padding: 12px;
    border-radius: 4px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
  }
  .card .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .card .title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card .body {
    color: var(--text);
    white-space: pre-wrap;
  }
  .card .tail {
    color: var(--text-dim);
    font-style: italic;
    margin-top: 6px;
  }
  .card .meta {
    margin-top: 8px;
    font: 11px/1.4 var(--mono);
    color: var(--text-dim);
  }
  .ctx-block {
    margin-bottom: 6px;
  }
  .ctx-block .label {
    font: 11px/1 var(--mono);
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font: 12px/1 var(--mono);
    color: var(--text-dim);
    display: flex;
    gap: 18px;
  }
  .footer .ok { color: var(--ok); }
  .footer .err { color: var(--err); }
  details > summary {
    cursor: pointer;
    color: var(--text-dim);
    font: 11px/1.4 var(--mono);
    margin-bottom: 4px;
  }
  details[open] > summary { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Harness Test</h1>
    <span class="sub">live trace of one harness fire — agentic loop with search/expand/ascend/deliberate</span>
  </header>

  <div class="composer">
    <input id="question" type="text" placeholder='ask anything — e.g. "what have we been working on lately?"' autocomplete="off">
    <button id="fire">Fire</button>
  </div>

  <main id="trace">
    <div class="empty">Type a question and hit Fire to watch the harness reason through it.</div>
  </main>

  <div class="footer">
    <span id="status">idle</span>
    <span id="turns"></span>
    <span id="elapsed"></span>
  </div>

<script>
const $question = document.getElementById('question');
const $fire = document.getElementById('fire');
const $trace = document.getElementById('trace');
const $status = document.getElementById('status');
const $turns = document.getElementById('turns');
const $elapsed = document.getElementById('elapsed');

let _firing = false;
let _abortController = null;
let _t0 = 0;
let _turnCount = 0;
let _elapsedTimer = null;

function getToken() {
  try { return localStorage.getItem('fathom-api-key') || ''; } catch { return ''; }
}

function clearTrace() {
  $trace.innerHTML = '';
  _turnCount = 0;
  $turns.textContent = '';
  $elapsed.textContent = '';
}

function nowHHMMSS() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

function addEvent({ kind, label, turn, body, badgeClass = '' }) {
  const header = el('div', { class: 'event-header' });
  const badge = el('span', {
    class: 'badge ' + (badgeClass || ''),
    text: label || kind,
  });
  header.appendChild(badge);
  if (turn) header.appendChild(el('span', { class: 'turn', text: 'turn ' + turn }));
  header.appendChild(el('time', { text: nowHHMMSS() }));

  const ev = el('div', { class: 'event' });
  ev.appendChild(header);
  if (body) ev.appendChild(el('div', { class: 'event-body' }, [body]));
  $trace.appendChild(ev);
  $trace.scrollTop = $trace.scrollHeight;
}

function renderToolCall(payload) {
  const body = el('div');
  if (payload.thinking) {
    body.appendChild(el('div', { class: 'thinking', text: payload.thinking }));
  }
  const argsStr = Object.entries(payload.args || {})
    .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
  body.appendChild(el('div', { class: 'args', text: `${payload.tool}(${argsStr})` }));
  return body;
}

function renderToolResult(payload) {
  const body = el('div');
  if (payload.error) {
    const err = el('pre', { text: 'ERROR: ' + payload.error });
    err.style.color = 'var(--err)';
    body.appendChild(err);
  } else if (payload.result) {
    body.appendChild(el('pre', { text: payload.result }));
  } else {
    body.appendChild(el('div', { class: 'thinking', text: '(no result)' }));
  }
  return body;
}

function renderRespond(payload) {
  const body = el('div');
  for (const card of (payload.cards || [])) {
    const c = el('div', { class: 'card' });
    if (card.kicker) c.appendChild(el('div', { class: 'kicker', text: card.kicker }));
    if (card.title) c.appendChild(el('div', { class: 'title', text: card.title }));
    if (card.body) c.appendChild(el('div', { class: 'body', text: card.body }));
    if (card.tail) c.appendChild(el('div', { class: 'tail', text: card.tail }));
    const metaParts = [`route: ${card.route}`];
    if (card.addresses && card.addresses.length) {
      metaParts.push(`addresses: [${card.addresses.join(', ')}]`);
    }
    c.appendChild(el('div', { class: 'meta', text: metaParts.join(' · ') }));
    body.appendChild(c);
  }
  if (payload.attestation) {
    const det = el('details');
    det.appendChild(el('summary', { text: 'attestation + mood + citations' }));
    const inner = el('div');
    inner.appendChild(el('div', { class: 'thinking', text: payload.attestation }));
    if (payload.mood_shift) {
      inner.appendChild(el('div', { class: 'args',
        text: `mood: ${payload.mood_shift.direction}${payload.mood_shift.axis} ` +
              `(${payload.mood_shift.magnitude}) — ${payload.mood_shift.reason || ''}` }));
    }
    if ((payload.cited_ids || []).length) {
      inner.appendChild(el('div', { class: 'args',
        text: 'cited: ' + payload.cited_ids.join(', ') }));
    }
    if ((payload.dropped_ids || []).length) {
      inner.appendChild(el('div', { class: 'args',
        text: 'dropped: ' + payload.dropped_ids.join(', ') }));
    }
    det.appendChild(inner);
    body.appendChild(det);
  }
  return body;
}

function renderContext(payload) {
  const body = el('div');
  for (const [field, label] of [
    ['intent_block', 'INTENTS'],
    ['standpoint_block', 'STANDPOINT'],
    ['hosts_block', 'HOSTS'],
    ['routines_block', 'ROUTINES'],
  ]) {
    const v = (payload[field] || '').trim();
    if (!v) continue;
    const blk = el('div', { class: 'ctx-block' });
    blk.appendChild(el('div', { class: 'label', text: label }));
    blk.appendChild(el('pre', { text: v }));
    body.appendChild(blk);
  }
  return body;
}

function handleEvent(eventName, payload) {
  switch (eventName) {
    case 'seeded':
      addEvent({
        kind: 'seeded',
        label: 'seed',
        body: el('pre', { text:
          `session: ${payload.session_tag}\nintent:  ${payload.intent_id}\nquestion: ${payload.question}` }),
      });
      break;
    case 'standpoint':
      addEvent({
        kind: 'standpoint',
        label: 'standpoint',
        body: el('pre', { text:
          `posture: ${payload.posture}\naffect:  ${payload.affect_state}\n` +
          `endorsements: ${payload.endorsements}\nunderstanding: ${payload.understanding}` }),
      });
      break;
    case 'context_built':
      addEvent({ kind: 'context_built', label: 'context', body: renderContext(payload) });
      break;
    case 'turn_begin':
      _turnCount = payload.turn;
      $turns.textContent = `turn ${_turnCount}`;
      break;
    case 'tool_call': {
      const tool = (payload.tool || '').toLowerCase();
      addEvent({
        kind: 'tool_call',
        label: tool,
        turn: payload.turn,
        badgeClass: 'tool-' + (tool || 'unknown'),
        body: renderToolCall(payload),
      });
      break;
    }
    case 'tool_result':
      addEvent({
        kind: 'tool_result',
        label: 'result',
        turn: payload.turn,
        body: renderToolResult(payload),
      });
      break;
    case 'respond':
      addEvent({
        kind: 'respond',
        label: 'respond',
        turn: payload.turn,
        badgeClass: 'respond',
        body: renderRespond(payload),
      });
      break;
    case 'parse_error':
      addEvent({
        kind: 'parse_error',
        label: 'parse-error',
        turn: payload.turn,
        badgeClass: 'error',
        body: el('pre', { text: `head: ${payload.raw_head}\ntail: ${payload.raw_tail}` }),
      });
      break;
    case 'unknown_kind':
      addEvent({
        kind: 'unknown_kind',
        label: 'unknown-kind',
        turn: payload.turn,
        badgeClass: 'error',
        body: el('pre', { text: `kind: ${payload.kind}\nraw: ${JSON.stringify(payload.raw)}` }),
      });
      break;
    case 'max_turns_reached':
      addEvent({
        kind: 'max_turns_reached',
        label: 'max-turns',
        badgeClass: 'error',
        body: el('div', { class: 'thinking', text:
          `Hit ${payload.max_turns} turn cap without responding — silent fire.` }),
      });
      break;
    case 'finished':
      $status.innerHTML = '<span class="ok">finished</span>';
      addEvent({
        kind: 'finished',
        label: 'done',
        badgeClass: 'respond',
        body: el('pre', { text: `addressed: ${JSON.stringify(payload.addressed)}` }),
      });
      break;
    case 'warning':
      addEvent({
        kind: 'warning',
        label: 'warning',
        body: el('pre', { text: `${payload.where}: ${payload.type}: ${payload.message}` }),
      });
      break;
    case 'error':
      $status.innerHTML = '<span class="err">error</span>';
      addEvent({
        kind: 'error',
        label: 'error',
        badgeClass: 'error',
        body: el('pre', { text: `${payload.where || '?'}: ${payload.type || ''}: ${payload.message || ''}` }),
      });
      break;
    default:
      addEvent({
        kind: eventName,
        label: eventName,
        body: el('pre', { text: JSON.stringify(payload, null, 2) }),
      });
  }
}

async function fire() {
  if (_firing) return;
  const q = $question.value.trim();
  if (!q) return;
  const token = getToken();
  if (!token) {
    alert('No API token in localStorage. Log in to the dashboard first.');
    return;
  }

  _firing = true;
  $fire.disabled = true;
  $status.textContent = 'firing…';
  clearTrace();

  _t0 = performance.now();
  _elapsedTimer = setInterval(() => {
    const s = (performance.now() - _t0) / 1000;
    $elapsed.textContent = s.toFixed(1) + 's';
  }, 100);

  _abortController = new AbortController();
  try {
    const url = '/v1/harness/test?question=' + encodeURIComponent(q);
    const resp = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream' },
      signal: _abortController.signal,
    });
    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()));
    }
    if (!resp.body) throw new Error('no response body');

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE event delimiter is a blank line.
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith(':')) continue;
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { payload = { _raw: data }; }
        handleEvent(event, payload);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      $status.innerHTML = '<span class="err">' + (e.message || 'error') + '</span>';
      console.error(e);
    }
  } finally {
    clearInterval(_elapsedTimer);
    _firing = false;
    $fire.disabled = false;
    if (!$status.querySelector('.ok') && !$status.querySelector('.err')) {
      $status.textContent = 'idle';
    }
  }
}

$fire.addEventListener('click', fire);
$question.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); }
});
$question.focus();
</script>
</body>
</html>
