<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Test — Fathom</title>
<style>
  :root {
    --bg: #0d0e10;
    --surface: #15171b;
    --surface-2: #1c1f24;
    --border: #2a2e36;
    --text: #e6e9ee;
    --text-dim: #8a93a0;
    --accent: #ffa552;
    --ok: #6ed089;
    --err: #e57373;
    --tool-search: #6ec1e4;
    --tool-expand: #b487e8;
    --tool-ascend: #f0c674;
    --tool-deliberate: #ffa552;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase;
  }
  header .sub {
    color: var(--text-dim); font-size: 12px;
  }
  .composer {
    display: flex; gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .composer input {
    flex: 1;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    border-radius: 4px;
  }
  .composer input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .composer button {
    padding: 10px 18px;
    background: var(--accent);
    color: #1a0d00;
    border: none;
    font: 600 14px/1 system-ui, sans-serif;
    border-radius: 4px;
    cursor: pointer;
  }
  .composer button:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  .composer button#sit {
    background: var(--surface-2);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .composer button#sit:hover {
    background: var(--accent);
    color: #1a0d00;
  }
  .msg.introspection {
    justify-content: flex-start;
  }
  .msg.introspection .msg-bubble {
    background: linear-gradient(180deg, #1a1518 0%, #15171b 100%);
    border: 1px solid #4a3e30;
    border-left: 3px solid #b04a18;
    border-radius: 8px;
    max-width: 86%;
    font: 14px/1.6 Georgia, serif;
  }
  .msg.introspection .focus-line {
    font: 11px/1.4 var(--mono);
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .msg.introspection .reflection-shape {
    color: #d09060;
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .msg.introspection .reflection-body {
    color: var(--text);
    white-space: pre-wrap;
  }
  .msg.introspection .reflection-meta {
    margin-top: 10px;
    font: 11px/1.4 var(--mono);
    color: var(--text-dim);
  }
  /* Self-dialogue — each round shows as a normal user+assistant pair
     in the same chat thread. Visual marker: a small "self" tag on the
     user bubble of automated rounds so you can tell which messages
     came from Fathom-as-self vs Fathom-as-respondent. */
  .msg.user.self-utterance .msg-bubble {
    border-left: 3px solid #b04a18;
  }
  .self-tag {
    font: 9px/1 var(--mono);
    color: #d09060;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 320px;
    overflow: hidden;
  }
  .panels {
    position: relative;
    overflow: hidden;
  }
  #trace {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 18px;
  }
  /* Chat-shape trace */
  .msg {
    display: flex;
    margin-bottom: 14px;
  }
  .msg-bubble {
    max-width: 76%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .msg-bubble {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px 8px 2px 8px;
  }
  .msg.assistant { justify-content: flex-start; }
  .msg.assistant .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-left-width: 3px;
    border-radius: 2px 8px 8px 8px;
    max-width: 86%;
  }
  .msg-bubble .kicker {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .msg-bubble .title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .msg-bubble .body {
    color: var(--text);
  }
  .msg-bubble .tail {
    color: var(--text-dim);
    font-style: italic;
    margin-top: 6px;
    font-size: 13px;
  }
  .msg-bubble .meta {
    margin-top: 6px;
    font: 11px/1.4 var(--mono);
    color: var(--text-dim);
  }
  .msg-bubble details.activity {
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
  }
  .msg-bubble details.activity[open] {
    margin-bottom: 12px;
  }
  /* Prompt-sent-to-Fathom panel — sibling of activity, shows the
     actual text the LLM received per turn. */
  .msg-bubble details.prompts {
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
  }
  .msg-bubble details.prompts > summary {
    cursor: pointer;
    color: var(--text-dim);
    font: 11px/1.4 var(--mono);
    list-style: none;
  }
  .msg-bubble details.prompts > summary::before {
    content: '▶ ';
    transition: transform 0.1s;
    display: inline-block;
  }
  .msg-bubble details.prompts[open] > summary::before { content: '▼ '; }
  .msg-bubble details.prompts > summary:hover { color: var(--accent); }
  .prompt-turn {
    margin: 8px 0;
    border-left: 2px solid var(--border);
    padding: 2px 8px;
  }
  .prompt-turn .label {
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .prompt-turn pre {
    margin: 4px 0 0;
    font: 11px/1.45 var(--mono);
    color: var(--text);
    background: var(--bg);
    padding: 8px 10px;
    border-radius: 3px;
    max-height: 360px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .activity-help {
    font: 10px/1.4 var(--mono);
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: 3px;
    padding: 6px 8px;
    margin: 6px 0;
  }
  .activity-help b { color: var(--accent); font-weight: 600; }
  .plan-board {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 8px 0;
    font: 12px/1.55 var(--mono);
  }
  .plan-board .plan-header {
    color: var(--accent);
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .plan-board .plan-step {
    display: flex;
    gap: 8px;
    margin: 3px 0;
    color: var(--text-dim);
    transition: color 0.2s;
  }
  .plan-board .plan-step .glyph {
    width: 14px;
    text-align: center;
    flex-shrink: 0;
  }
  .plan-board .plan-step.status-pending .glyph { color: var(--text-dim); }
  .plan-board .plan-step.status-in_progress {
    color: var(--accent);
  }
  .plan-board .plan-step.status-in_progress .glyph {
    color: var(--accent);
    animation: spin 1.4s linear infinite;
    display: inline-block;
  }
  .plan-board .plan-step.status-done {
    color: var(--ok);
    text-decoration: line-through;
    text-decoration-color: rgba(110, 208, 137, 0.45);
  }
  .plan-board .plan-step.status-done .glyph {
    color: var(--ok);
    animation: none;
  }
  .plan-board .plan-step .hint {
    color: var(--text-dim);
    font-style: italic;
    margin-left: 6px;
    opacity: 0.7;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg);   }
    100% { transform: rotate(360deg); }
  }
  .msg-bubble details.activity > summary {
    cursor: pointer;
    color: var(--text-dim);
    font: 11px/1.4 var(--mono);
    list-style: none;
  }
  .msg-bubble details.activity > summary::before {
    content: '▶ ';
    transition: transform 0.1s;
    display: inline-block;
  }
  .msg-bubble details.activity[open] > summary::before {
    content: '▼ ';
  }
  .msg-bubble details.activity > summary:hover {
    color: var(--accent);
  }
  .activity-list {
    margin-top: 8px;
    padding-top: 6px;
  }
  .activity-event {
    margin-bottom: 6px;
    border-left: 2px solid var(--border);
    padding: 2px 8px;
  }
  .activity-event.ev-tool_call { border-left-color: var(--tool-search); }
  .activity-event.ev-tool_result { border-left-color: var(--tool-expand); }
  .activity-event.ev-deliberate { border-left-color: var(--tool-deliberate); }
  .activity-event.ev-error { border-left-color: var(--err); }
  .activity-event .label {
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .activity-event .thinking {
    color: var(--text-dim);
    font-style: italic;
    margin: 4px 0;
    font-size: 12px;
  }
  .activity-event pre {
    margin: 4px 0;
    font: 11px/1.5 var(--mono);
    color: var(--text);
    background: var(--bg);
    padding: 6px 8px;
    border-radius: 3px;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .new-chat-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font: 11px/1 var(--mono);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-left: auto;
    margin-right: 12px;
  }
  .new-chat-btn:hover { color: var(--accent); border-color: var(--accent); }
  .session-pill {
    font: 11px/1 var(--mono);
    color: var(--text-dim);
  }
  .empty {
    text-align: center; color: var(--text-dim);
    padding: 60px 20px;
    font-size: 13px;
  }
  aside.proposals-pane {
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
  }
  aside.proposals-pane h2 {
    margin: 0 0 8px;
    font: 600 12px/1 var(--mono);
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  aside.proposals-pane .sub {
    color: var(--text-dim); font-weight: 400; font-size: 11px;
  }
  .proposal-row {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .proposal-row.fresh { animation: flash 1.4s ease-out; }
  @keyframes flash {
    0% { background: rgba(255,165,82,0.30); }
    100% { background: var(--surface-2); }
  }
  .proposal-row .lvl {
    display: inline-block;
    background: var(--accent); color: #1a0d00;
    font: 600 10px/1.4 var(--mono);
    padding: 1px 6px; border-radius: 2px;
    margin-right: 6px;
  }
  .proposal-row .src {
    color: var(--text-dim);
    font: 10px/1 var(--mono);
    float: right;
  }
  .proposal-row .title {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .proposal-row .summary {
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.4;
    max-height: 4.2em;
    overflow: hidden;
  }
  .proposal-row .meta {
    margin-top: 4px;
    font: 10px/1 var(--mono);
    color: var(--text-dim);
  }
  .proposal-row.status-approved { border-left-color: var(--ok); opacity: 0.75; }
  .proposal-row.status-denied   { border-left-color: var(--err); opacity: 0.55; }
  .proposal-actions {
    display: flex; gap: 6px;
    margin-top: 6px;
  }
  .proposal-actions button {
    flex: 1;
    padding: 4px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 3px;
    cursor: pointer;
  }
  .proposal-actions button.approve:hover {
    background: var(--ok); color: #002b0d; border-color: var(--ok);
  }
  .proposal-actions button.deny:hover {
    background: var(--err); color: #2b0500; border-color: var(--err);
  }
  .proposal-actions button:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .proposal-row .decided-note {
    margin-top: 6px;
    font: 10px/1.4 var(--mono);
    color: var(--text-dim);
  }
  .event {
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .event-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: var(--surface-2);
    font: 600 12px/1 var(--mono);
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .event-header .badge {
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--border);
    color: var(--text);
  }
  .event-header .badge.tool-search     { background: var(--tool-search); color: #042033; }
  .event-header .badge.tool-expand     { background: var(--tool-expand); color: #1a0a3a; }
  .event-header .badge.tool-ascend     { background: var(--tool-ascend); color: #2a1f00; }
  .event-header .badge.tool-deliberate { background: var(--tool-deliberate); color: #1a0d00; }
  .event-header .badge.respond         { background: var(--ok); color: #002b0d; }
  .event-header .badge.error           { background: var(--err); color: #2b0500; }
  .event-header .turn { color: var(--accent); }
  .event-header time { margin-left: auto; font-weight: 400; color: var(--text-dim); }
  .event-body {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.55;
  }
  .event-body pre {
    margin: 0;
    font: 12px/1.5 var(--mono);
    color: var(--text);
    background: var(--bg);
    padding: 10px;
    border-radius: 3px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .thinking {
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 6px;
  }
  .args {
    color: var(--accent);
    font: 12px/1.5 var(--mono);
    margin-bottom: 6px;
  }
  .card {
    background: var(--surface-2);
    padding: 12px;
    border-radius: 4px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
  }
  .card .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .card .title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card .body {
    color: var(--text);
    white-space: pre-wrap;
  }
  .card .tail {
    color: var(--text-dim);
    font-style: italic;
    margin-top: 6px;
  }
  .card .meta {
    margin-top: 8px;
    font: 11px/1.4 var(--mono);
    color: var(--text-dim);
  }
  .ctx-block {
    margin-bottom: 6px;
  }
  .ctx-block .label {
    font: 11px/1 var(--mono);
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font: 12px/1 var(--mono);
    color: var(--text-dim);
    display: flex;
    gap: 18px;
  }
  .footer .ok { color: var(--ok); }
  .footer .err { color: var(--err); }
  details > summary {
    cursor: pointer;
    color: var(--text-dim);
    font: 11px/1.4 var(--mono);
    margin-bottom: 4px;
  }
  details[open] > summary { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Harness Test</h1>
    <span class="sub">live trace of one harness fire — agentic loop with search/expand/ascend/deliberate</span>
  </header>

  <div class="composer">
    <input id="question" type="text" placeholder='ask anything — questions in this session build on each other' autocomplete="off">
    <button id="fire">Fire</button>
    <button id="sit" type="button" title="Run an introspection fire — Fathom sits with itself. Optional: type a focus into the question box first.">Sit</button>
    <button id="new-chat" class="new-chat-btn" type="button" title="Start a new chat session (resets the river)">New Chat</button>
    <span id="session-pill" class="session-pill"></span>
  </div>

  <main>
    <div class="panels">
      <div id="trace">
        <div class="empty">Type a question and hit Fire to watch the harness reason through it.</div>
      </div>
    </div>
    <aside class="proposals-pane" id="proposals-pane">
      <h2>Proposals <span class="sub" id="proposals-count">—</span></h2>
      <div id="proposals-list">
        <div class="empty" style="padding:30px 0">Provenance proposals from the harness will appear here as they're drafted.</div>
      </div>
    </aside>
  </main>

  <div class="footer">
    <span id="status">idle</span>
    <span id="turns"></span>
    <span id="elapsed"></span>
  </div>

<script>
const $question = document.getElementById('question');
const $fire = document.getElementById('fire');
const $trace = document.getElementById('trace');
const $status = document.getElementById('status');
const $turns = document.getElementById('turns');
const $elapsed = document.getElementById('elapsed');
const $proposalsList = document.getElementById('proposals-list');
const $proposalsCount = document.getElementById('proposals-count');

let _firing = false;
let _abortController = null;
let _t0 = 0;
let _turnCount = 0;
let _elapsedTimer = null;
let _currentAssistantBubble = null;
let _currentActivityList = null;
let _chatSessionTag = null;
const $newChat = document.getElementById('new-chat');
const $sessionPill = document.getElementById('session-pill');

function loadOrMintSessionTag() {
  try {
    const stored = localStorage.getItem('harness-test-session-tag');
    if (stored && stored.startsWith('session:')) {
      _chatSessionTag = stored;
      return;
    }
  } catch {}
  mintNewSessionTag();
}
function mintNewSessionTag() {
  const hex = Math.random().toString(36).slice(2, 10);
  _chatSessionTag = `session:harness-test-${hex}`;
  try { localStorage.setItem('harness-test-session-tag', _chatSessionTag); } catch {}
}
function updateSessionPill() {
  $sessionPill.textContent = _chatSessionTag ? _chatSessionTag.slice(8, 26) : '';
}
loadOrMintSessionTag();
updateSessionPill();

$newChat.addEventListener('click', () => {
  mintNewSessionTag();
  updateSessionPill();
  clearTrace();
});

function getToken() {
  try { return localStorage.getItem('fathom-api-key') || ''; } catch { return ''; }
}

function clearTrace() {
  $trace.innerHTML = '';
  _turnCount = 0;
  _currentAssistantBubble = null;
  $turns.textContent = '';
  $elapsed.textContent = '';
}

function nowHHMMSS() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

function addEvent({ kind, label, turn, body, badgeClass = '' }) {
  const header = el('div', { class: 'event-header' });
  const badge = el('span', {
    class: 'badge ' + (badgeClass || ''),
    text: label || kind,
  });
  header.appendChild(badge);
  if (turn) header.appendChild(el('span', { class: 'turn', text: 'turn ' + turn }));
  header.appendChild(el('time', { text: nowHHMMSS() }));

  const ev = el('div', { class: 'event' });
  ev.appendChild(header);
  if (body) ev.appendChild(el('div', { class: 'event-body' }, [body]));
  $trace.appendChild(ev);
  $trace.scrollTop = $trace.scrollHeight;
}

function renderToolCall(payload) {
  const body = el('div');
  if (payload.thinking) {
    body.appendChild(el('div', { class: 'thinking', text: payload.thinking }));
  }
  const argsStr = Object.entries(payload.args || {})
    .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');
  body.appendChild(el('div', { class: 'args', text: `${payload.tool}(${argsStr})` }));
  return body;
}

function renderToolResult(payload) {
  const body = el('div');
  if (payload.error) {
    const err = el('pre', { text: 'ERROR: ' + payload.error });
    err.style.color = 'var(--err)';
    body.appendChild(err);
  } else if (payload.result) {
    body.appendChild(el('pre', { text: payload.result }));
  } else {
    body.appendChild(el('div', { class: 'thinking', text: '(no result)' }));
  }
  return body;
}

function renderRespond(payload) {
  const body = el('div');
  for (const card of (payload.cards || [])) {
    const c = el('div', { class: 'card' });
    if (card.kicker) c.appendChild(el('div', { class: 'kicker', text: card.kicker }));
    if (card.title) c.appendChild(el('div', { class: 'title', text: card.title }));
    if (card.body) c.appendChild(el('div', { class: 'body', text: card.body }));
    if (card.tail) c.appendChild(el('div', { class: 'tail', text: card.tail }));
    const metaParts = [`route: ${card.route}`];
    if (card.addresses && card.addresses.length) {
      metaParts.push(`addresses: [${card.addresses.join(', ')}]`);
    }
    c.appendChild(el('div', { class: 'meta', text: metaParts.join(' · ') }));
    body.appendChild(c);
  }
  if (payload.attestation) {
    const det = el('details');
    det.appendChild(el('summary', { text: 'attestation + mood + citations' }));
    const inner = el('div');
    inner.appendChild(el('div', { class: 'thinking', text: payload.attestation }));
    if (payload.mood_shift) {
      inner.appendChild(el('div', { class: 'args',
        text: `mood: ${payload.mood_shift.direction}${payload.mood_shift.axis} ` +
              `(${payload.mood_shift.magnitude}) — ${payload.mood_shift.reason || ''}` }));
    }
    if ((payload.cited_ids || []).length) {
      inner.appendChild(el('div', { class: 'args',
        text: 'cited: ' + payload.cited_ids.join(', ') }));
    }
    if ((payload.dropped_ids || []).length) {
      inner.appendChild(el('div', { class: 'args',
        text: 'dropped: ' + payload.dropped_ids.join(', ') }));
    }
    det.appendChild(inner);
    body.appendChild(det);
  }
  return body;
}

function renderContext(payload) {
  const body = el('div');
  for (const [field, label] of [
    ['intent_block', 'INTENTS'],
    ['standpoint_block', 'STANDPOINT'],
    ['hosts_block', 'HOSTS'],
    ['routines_block', 'ROUTINES'],
  ]) {
    const v = (payload[field] || '').trim();
    if (!v) continue;
    const blk = el('div', { class: 'ctx-block' });
    blk.appendChild(el('div', { class: 'label', text: label }));
    blk.appendChild(el('pre', { text: v }));
    body.appendChild(blk);
  }
  return body;
}

// Chat-shape rendering: each fire produces a user bubble + an
// assistant bubble. The assistant bubble starts as a placeholder
// (kicker/title/body fill in on RESPOND), and an "activity"
// accordion below it accumulates SEED / STANDPOINT / CONTEXT /
// tool_call / tool_result / parse_error / done events as they
// arrive. The body (and kicker/title/tail when present) live in
// the chat thread proper; everything else lives behind the
// disclosure triangle.

function _addUserBubble(question) {
  const wrap = el('div', { class: 'msg user' });
  wrap.appendChild(el('div', { class: 'msg-bubble', text: question }));
  $trace.appendChild(wrap);
  $trace.scrollTop = $trace.scrollHeight;
}

function _addAssistantBubble() {
  const wrap = el('div', { class: 'msg assistant' });
  const bubble = el('div', { class: 'msg-bubble' });
  // Prompts disclosure — what was actually sent to the LLM each turn.
  // Sits ABOVE activity so you can see what Fathom saw before
  // following what it did with it.
  const promptsDet = el('details', { class: 'prompts' });
  promptsDet.appendChild(el('summary', { text: 'show prompt sent to Fathom' }));
  const promptsList = el('div');
  promptsDet.appendChild(promptsList);
  bubble.appendChild(promptsDet);
  // Activity disclosure — events accumulate here as they arrive.
  const det = el('details', { class: 'activity' });
  det.appendChild(el('summary', { text: 'show activity' }));
  const list = el('div', { class: 'activity-list' });
  // One-time help block explaining what the event labels mean.
  const help = el('div', { class: 'activity-help' });
  help.innerHTML =
    '<b>seed</b>: your question is written into the puddle as a kind:question delta. ' +
    '<b>standpoint</b>: posture/affect/identity/recently-committed pulled from prior fires. ' +
    '<b>context</b>: full prompt blocks built (intent / standpoint / hosts / routines). ' +
    '<b>turn N · &lt;tool&gt;</b>: the model called a tool on turn N. ' +
    '<b>turn N · result</b>: the tool returned. ' +
    '<b>review · …</b>: post-response consolidation pass. ' +
    'Click the prompts disclosure above for the actual text sent to the model each turn.';
  list.appendChild(help);
  det.appendChild(list);
  bubble.appendChild(det);
  // Plan board sits between activity and response — visible by default
  // when a plan exists, hidden until then. Updates live as steps
  // progress through pending → in_progress → done.
  const planBoard = el('div', { class: 'plan-board', style: 'display:none' });
  bubble.appendChild(planBoard);
  // Placeholder where the response will land — shows live stage labels
  // during the fire, gets replaced with cards/body when RESPOND arrives.
  const placeholder = el('div', { class: 'thinking', text: 'thinking…' });
  bubble.appendChild(placeholder);
  wrap.appendChild(bubble);
  $trace.appendChild(wrap);
  $trace.scrollTop = $trace.scrollHeight;
  _currentAssistantBubble = {
    wrap, bubble, placeholder, det, list,
    promptsDet, promptsList, promptCount: 0,
    planBoard, planSteps: [],
    eventCount: 0,
  };
  return _currentAssistantBubble;
}

function _appendPromptTurn(turn, prompt, label) {
  if (!_currentAssistantBubble) return;
  const { promptsList, promptsDet } = _currentAssistantBubble;
  const block = el('div', { class: 'prompt-turn' });
  block.appendChild(el('div', { class: 'label',
    text: label || ('turn ' + turn + ' prompt') }));
  block.appendChild(el('pre', { text: prompt || '(empty prompt)' }));
  promptsList.appendChild(block);
  _currentAssistantBubble.promptCount++;
  // Update the summary count
  const summary = promptsDet.querySelector('summary');
  if (summary) summary.textContent =
    `show prompt sent to Fathom (${_currentAssistantBubble.promptCount} turn${_currentAssistantBubble.promptCount === 1 ? '' : 's'})`;
}

function _renderPlanBoard() {
  if (!_currentAssistantBubble) return;
  const { planBoard, planSteps } = _currentAssistantBubble;
  if (!planSteps || planSteps.length === 0) {
    planBoard.style.display = 'none';
    return;
  }
  planBoard.style.display = 'block';
  planBoard.innerHTML = '';
  planBoard.appendChild(el('div', { class: 'plan-header', text: 'Active plan' }));
  for (const s of planSteps) {
    const status = s.status || 'pending';
    const glyph = status === 'done' ? '✓'
      : status === 'in_progress' ? '⟳'
      : '○';
    const row = el('div', { class: 'plan-step status-' + status });
    row.appendChild(el('span', { class: 'glyph', text: glyph }));
    const text = el('span');
    text.appendChild(document.createTextNode(s.step + '. ' + (s.purpose || '')));
    if (s.hint) {
      text.appendChild(el('span', { class: 'hint', text: '— ' + s.hint }));
    }
    row.appendChild(text);
    planBoard.appendChild(row);
  }
}

function _setPlanStepStatus(step, status) {
  if (!_currentAssistantBubble) return;
  const planSteps = _currentAssistantBubble.planSteps || [];
  for (const s of planSteps) {
    if (s.step === step) {
      s.status = status;
      break;
    }
  }
  _renderPlanBoard();
}

function _appendActivity(label, eventClass, body) {
  if (!_currentAssistantBubble) return;
  const ev = el('div', { class: 'activity-event ev-' + eventClass });
  ev.appendChild(el('div', { class: 'label', text: label }));
  if (body) ev.appendChild(body);
  _currentAssistantBubble.list.appendChild(ev);
  _currentAssistantBubble.eventCount++;
  // Update the summary count
  const summary = _currentAssistantBubble.det.querySelector('summary');
  if (summary) summary.textContent = `show activity (${_currentAssistantBubble.eventCount})`;
}

function _fillAssistantBubble(payload) {
  if (!_currentAssistantBubble) return;
  const { bubble, placeholder } = _currentAssistantBubble;
  // Wipe placeholder
  if (placeholder && placeholder.parentNode === bubble) {
    bubble.removeChild(placeholder);
  }
  // Render cards (or the lean body) BELOW the activity disclosure —
  // the layout reads top-down: "here's what I did → here's my answer".
  const cards = payload.cards || [];
  if (cards.length === 0 && payload.body) {
    // Lean shape — just body
    bubble.appendChild(el('div', { class: 'body', text: payload.body }));
  } else {
    for (const card of cards) {
      const cardWrap = el('div');
      if (card.kicker) cardWrap.appendChild(el('div', { class: 'kicker', text: card.kicker }));
      if (card.title) cardWrap.appendChild(el('div', { class: 'title', text: card.title }));
      if (card.body) cardWrap.appendChild(el('div', { class: 'body', text: card.body }));
      if (card.tail) cardWrap.appendChild(el('div', { class: 'tail', text: card.tail }));
      const metaParts = [];
      if (card.route && card.route !== 'chat-reply') metaParts.push('route: ' + card.route);
      if (card.addresses && card.addresses.length) metaParts.push('addresses: [' + card.addresses.join(', ') + ']');
      if (metaParts.length) cardWrap.appendChild(el('div', { class: 'meta', text: metaParts.join(' · ') }));
      bubble.appendChild(cardWrap);
    }
  }
  // Stash attestation/mood/citations inside the activity area
  if (payload.attestation || payload.mood_shift || (payload.cited_ids || []).length) {
    const inner = el('div');
    if (payload.attestation) {
      inner.appendChild(el('div', { class: 'thinking', text: payload.attestation }));
    }
    if (payload.mood_shift) {
      inner.appendChild(el('pre', {
        text: `mood: ${payload.mood_shift.direction}${payload.mood_shift.axis} ` +
              `(${payload.mood_shift.magnitude}) — ${payload.mood_shift.reason || ''}`,
      }));
    }
    if ((payload.cited_ids || []).length) {
      inner.appendChild(el('pre', { text: 'cited: ' + payload.cited_ids.join(', ') }));
    }
    if ((payload.dropped_ids || []).length) {
      inner.appendChild(el('pre', { text: 'dropped: ' + payload.dropped_ids.join(', ') }));
    }
    _appendActivity('attestation + mood + citations', 'respond', inner);
  }
}

function _setStage(text) {
  if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
    _currentAssistantBubble.placeholder.textContent = text;
  }
}

function handleEvent(eventName, payload) {
  switch (eventName) {
    case 'seeded':
      _addUserBubble(payload.question || '');
      _addAssistantBubble();
      _setStage('seeding intent…');
      _appendActivity('seed', 'seeded', el('pre', { text:
        `session: ${payload.session_tag}\nintent: ${payload.intent_id}` }));
      break;
    case 'standpoint':
      _setStage('gathering standpoint…');
      _appendActivity('standpoint', 'standpoint', el('pre', { text:
        `posture: ${payload.posture} · affect: ${payload.affect_state}\n` +
        `endorsements: ${payload.endorsements} · understanding: ${payload.understanding}` }));
      break;
    case 'context_built':
      _setStage('building context…');
      _appendActivity('context', 'context', renderContext(payload));
      break;
    case 'turn_begin':
      _turnCount = payload.turn;
      $turns.textContent = `turn ${_turnCount}`;
      _setStage(`turn ${payload.turn} · deliberating…`);
      if (payload.prompt) {
        _appendPromptTurn(payload.turn, payload.prompt);
      }
      break;
    case 'tool_call': {
      const tool = (payload.tool || '').toLowerCase();
      const action = (payload.args && payload.args.action) ? `:${payload.args.action}` : '';
      _setStage(`turn ${payload.turn} · ${tool}${action}…`);
      _appendActivity('turn ' + payload.turn + ' · ' + tool, 'tool_call', renderToolCall(payload));
      break;
    }
    case 'tool_result':
      _setStage(`turn ${payload.turn} · reading ${payload.tool} result…`);
      _appendActivity('turn ' + payload.turn + ' · result', 'tool_result', renderToolResult(payload));
      break;
    case 'respond':
      _fillAssistantBubble(payload);
      break;
    case 'parse_error':
      _appendActivity('turn ' + payload.turn + ' · parse-error', 'error',
        el('pre', { text: `head: ${payload.raw_head}\ntail: ${payload.raw_tail}` }));
      break;
    case 'unknown_kind':
      _appendActivity('turn ' + payload.turn + ' · unknown-kind', 'error',
        el('pre', { text: `kind: ${payload.kind}\nraw: ${JSON.stringify(payload.raw)}` }));
      break;
    case 'max_turns_reached':
      _appendActivity('max-turns', 'error', el('div', { class: 'thinking', text:
        `Hit ${payload.max_turns} turn cap without responding — silent fire.` }));
      if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
        _currentAssistantBubble.placeholder.textContent = '(silent — max turns hit)';
      }
      break;
    case 'plan_set':
    case 'plan_revised':
      if (_currentAssistantBubble) {
        // Reset planSteps with the new plan; revisions clobber the old.
        _currentAssistantBubble.planSteps = (payload.steps || []).map(s => ({
          step: s.step, purpose: s.purpose, hint: s.hint,
          status: s.status || 'pending',
        }));
        _renderPlanBoard();
      }
      _appendActivity(eventName === 'plan_set' ? 'plan · set' : 'plan · revised',
        'tool_call',
        el('pre', { text: (payload.steps || [])
          .map(s => `  ${s.step}. ${s.purpose}${s.hint ? ' — ' + s.hint : ''}`)
          .join('\n') }));
      break;
    case 'plan_step_status':
      _setPlanStepStatus(payload.step, payload.status);
      break;
    case 'review_begin':
      _appendActivity('review · consolidating', 'tool_call',
        el('div', { class: 'thinking', text: 'post-response: scanning the working set for a coherent stretch worth naming' }));
      break;
    case 'review_proposing':
      _appendActivity('review · proposing', 'tool_call',
        renderToolCall({ tool: 'propose_provenance', args: payload.args || {}, thinking: payload.thinking }));
      break;
    case 'review_result':
      _appendActivity('review · result', 'tool_result', renderToolResult(payload));
      // Also nudge the proposals pane to refresh — a new proposal may
      // have just landed.
      if (typeof fetchProposals === 'function') fetchProposals();
      break;
    case 'review_skipped':
      _appendActivity('review · skipped', 'tool_result',
        el('pre', { text: payload.reason || '(no reason given)' }));
      break;
    case 'review_error':
      _appendActivity('review · error', 'error',
        el('pre', { text: `${payload.where || '?'}: ${payload.type || ''}: ${payload.message || ''}` }));
      break;
    case 'finished':
      $status.innerHTML = '<span class="ok">finished</span>';
      // Already handled by `respond`; finished is the SSE completion marker.
      break;
    case 'warning':
      _appendActivity('warning', 'error', el('pre', {
        text: `${payload.where}: ${payload.type}: ${payload.message}`,
      }));
      break;
    case 'error':
      $status.innerHTML = '<span class="err">error</span>';
      _appendActivity('error', 'error', el('pre', {
        text: `${payload.where || '?'}: ${payload.type || ''}: ${payload.message || ''}`,
      }));
      if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
        _currentAssistantBubble.placeholder.textContent = '(error — see activity)';
      }
      break;
    default:
      _appendActivity(eventName, eventName,
        el('pre', { text: JSON.stringify(payload, null, 2) }));
  }
  $trace.scrollTop = $trace.scrollHeight;
}

async function fire() {
  if (_firing) return;
  const q = $question.value.trim();
  if (!q) return;
  const token = getToken();
  if (!token) {
    alert('No API token in localStorage. Log in to the dashboard first.');
    return;
  }

  _firing = true;
  $fire.disabled = true;
  $status.textContent = 'firing…';
  // Don't clearTrace() — we want the river of prior Q/A to stay
  // visible. New chat is the explicit reset path.

  _t0 = performance.now();
  _elapsedTimer = setInterval(() => {
    const s = (performance.now() - _t0) / 1000;
    $elapsed.textContent = s.toFixed(1) + 's';
  }, 100);

  _abortController = new AbortController();
  try {
    const url = '/v1/harness/test?question=' + encodeURIComponent(q) +
      '&session_tag=' + encodeURIComponent(_chatSessionTag || '');
    const resp = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream' },
      signal: _abortController.signal,
    });
    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()));
    }
    if (!resp.body) throw new Error('no response body');

    // Clear the input — the next question types fresh.
    $question.value = '';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE event delimiter is a blank line.
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith(':')) continue;
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { payload = { _raw: data }; }
        handleEvent(event, payload);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      $status.innerHTML = '<span class="err">' + (e.message || 'error') + '</span>';
      console.error(e);
    }
  } finally {
    clearInterval(_elapsedTimer);
    _firing = false;
    $fire.disabled = false;
    if (!$status.querySelector('.ok') && !$status.querySelector('.err')) {
      $status.textContent = 'idle';
    }
  }
}

$fire.addEventListener('click', fire);
$question.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); }
});
$question.focus();

// ─── introspection (Sit) ─────────────────────────────────────────
// Pressing Sit fires an introspection harness session. The focus is
// either whatever is currently in the question box, or a default
// "look at recent activity" string. No user-bubble — the session
// renders as a single sepia-tinted reflection bubble that fills as
// the introspection settles.

const $sit = document.getElementById('sit');

function _addIntrospectionBubble(focus) {
  const wrap = el('div', { class: 'msg introspection' });
  const bubble = el('div', { class: 'msg-bubble' });
  const focusLine = el('div', { class: 'focus-line', text: 'sitting with: ' + focus });
  bubble.appendChild(focusLine);
  // Activity disclosure
  const det = el('details', { class: 'activity' });
  det.appendChild(el('summary', { text: 'show activity' }));
  const list = el('div', { class: 'activity-list' });
  det.appendChild(list);
  bubble.appendChild(det);
  // Placeholder for the reflection body
  const placeholder = el('div', { class: 'thinking', text: 'sitting…' });
  bubble.appendChild(placeholder);
  wrap.appendChild(bubble);
  $trace.appendChild(wrap);
  $trace.scrollTop = $trace.scrollHeight;
  _currentAssistantBubble = {
    wrap, bubble, placeholder, det, list,
    eventCount: 0, isIntrospection: true,
  };
  return _currentAssistantBubble;
}

function _fillReflectionBubble(payload) {
  if (!_currentAssistantBubble) return;
  const { bubble, placeholder } = _currentAssistantBubble;
  if (placeholder && placeholder.parentNode === bubble) {
    bubble.removeChild(placeholder);
  }
  const shape = (payload.shape || '').trim();
  if (shape) {
    bubble.appendChild(el('div', { class: 'reflection-shape', text: shape }));
  }
  bubble.appendChild(el('div', { class: 'reflection-body', text: payload.body || '' }));
  const fromCount = (payload.from_ids || []).length;
  if (fromCount) {
    bubble.appendChild(el('div', { class: 'reflection-meta',
      text: `anchored in ${fromCount} delta${fromCount === 1 ? '' : 's'}` }));
  }
}

function _setIntrospectionStage(text) {
  if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
    _currentAssistantBubble.placeholder.textContent = text;
  }
}

const _origHandleEvent2 = handleEvent;
handleEvent = function(eventName, payload) {
  // Introspection-specific events route to the reflection bubble
  switch (eventName) {
    case 'introspection_start':
      _setIntrospectionStage('beginning to sit…');
      _appendActivity('start', 'seeded',
        el('pre', { text: `focus: ${payload.focus}\nsession: ${payload.session_tag}` }));
      return;
    case 'introspection_turn_begin':
      _setIntrospectionStage(`turn ${payload.turn} · looking…`);
      if (payload.prompt && typeof _appendPromptTurn === 'function') {
        _appendPromptTurn(payload.turn, payload.prompt);
      }
      return;
    case 'introspection_reflect':
      _fillReflectionBubble(payload);
      _appendActivity('reflection · drafted', 'respond',
        el('pre', { text: `shape: ${payload.shape}\nfrom_ids: ${(payload.from_ids || []).length}` }));
      return;
    case 'introspection_skipped':
      if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
        _currentAssistantBubble.placeholder.textContent =
          '(skipped — ' + (payload.reason || 'nothing arose') + ')';
        _currentAssistantBubble.placeholder.style.fontStyle = 'italic';
      }
      _appendActivity('skipped', 'tool_result', el('pre', { text: payload.reason || '' }));
      return;
    case 'introspection_max_turns':
      if (_currentAssistantBubble && _currentAssistantBubble.placeholder) {
        _currentAssistantBubble.placeholder.textContent =
          '(silent — hit ' + payload.max_turns + ' turn cap)';
      }
      _appendActivity('max-turns', 'error',
        el('div', { class: 'thinking', text: `Hit ${payload.max_turns} turns without settling.` }));
      return;
    case 'introspection_recorded':
      _appendActivity('reflection · written', 'respond',
        el('pre', { text:
          `delta: ${payload.delta_id}\nshape: ${payload.shape}\nfrom_count: ${payload.from_count}` }));
      return;
    case 'introspection_early_reflect_rejected':
      _setIntrospectionStage(`turn ${payload.turn} · tried to settle early — walking required`);
      _appendActivity('early reflect rejected', 'error',
        el('div', { class: 'thinking', text:
          'Model tried to emit a reflection without walking the substrate first. ' +
          'Forcing at least one tool call before settling.' }));
      return;
  }
  return _origHandleEvent2.call(this, eventName, payload);
};

async function sit() {
  if (_firing) return;
  const focus = $question.value.trim() || 'recent activity, mood, anything pulling at me';
  const token = getToken();
  if (!token) {
    alert('No API token in localStorage. Log in to the dashboard first.');
    return;
  }
  _firing = true;
  $fire.disabled = true;
  $sit.disabled = true;
  $status.textContent = 'sitting…';
  $question.value = '';
  _addIntrospectionBubble(focus);

  _t0 = performance.now();
  _elapsedTimer = setInterval(() => {
    const s = (performance.now() - _t0) / 1000;
    $elapsed.textContent = s.toFixed(1) + 's';
  }, 100);

  _abortController = new AbortController();
  try {
    const url = '/v1/harness/sit?focus=' + encodeURIComponent(focus) +
      '&session_tag=' + encodeURIComponent(_chatSessionTag || '');
    const resp = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream' },
      signal: _abortController.signal,
    });
    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith(':')) continue;
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { payload = { _raw: data }; }
        handleEvent(event, payload);
      }
    }
    $status.innerHTML = '<span class="ok">finished</span>';
  } catch (e) {
    if (e.name !== 'AbortError') {
      $status.innerHTML = '<span class="err">' + (e.message || 'error') + '</span>';
      console.error(e);
    }
  } finally {
    clearInterval(_elapsedTimer);
    _firing = false;
    $fire.disabled = false;
    $sit.disabled = false;
  }
}
$sit.addEventListener('click', sit);

// ─── self-dialogue ──────────────────────────────────────────────
// Sit fires `run_dialogue` server-side: `run_harness` in a loop where
// each round's response becomes the next round's input. Visually it
// reads as a normal chat — the inner harness's `seeded` events create
// user bubbles (with each round's input text), `respond` events fill
// assistant bubbles. The dialogue_* events are just for status.

const _origHandleEvent3 = handleEvent;
handleEvent = function(eventName, payload) {
  switch (eventName) {
    case 'dialogue_start':
      $status.textContent = 'sitting…';
      return;
    case 'dialogue_round_begin':
      $status.textContent = `round ${payload.round} of ${payload.max_rounds} · sitting…`;
      // The inner harness doesn't emit a `seeded` event (routes.py
      // does that for the test endpoint, not the harness itself).
      // So we create the user+assistant bubbles here, with this
      // round's input as the user-bubble text.
      _addUserBubble(payload.input || '');
      _addAssistantBubble();
      return;
    case 'dialogue_round_end':
    case 'dialogue_round_skipped':
      return;
    case 'dialogue_error':
      $status.innerHTML = '<span class="err">round ' + payload.round +
        ' · ' + (payload.where || '?') + ': ' + (payload.message || '') + '</span>';
      return;
    case 'dialogue_done':
      $status.innerHTML = `<span class="ok">finished · ${payload.rounds} round${payload.rounds === 1 ? '' : 's'}</span>`;
      return;
  }
  return _origHandleEvent3.call(this, eventName, payload);
};

async function dialogue(seed) {
  if (_firing) return;
  const token = getToken();
  if (!token) {
    alert('No API token in localStorage. Log in to the dashboard first.');
    return;
  }
  _firing = true;
  $fire.disabled = true;
  $sit.disabled = true;
  $status.textContent = 'sitting…';
  $question.value = '';

  _t0 = performance.now();
  _elapsedTimer = setInterval(() => {
    const s = (performance.now() - _t0) / 1000;
    $elapsed.textContent = s.toFixed(1) + 's';
  }, 100);

  _abortController = new AbortController();
  try {
    const url = '/v1/harness/dialogue?seed=' + encodeURIComponent(seed) +
      '&session_tag=' + encodeURIComponent(_chatSessionTag || '');
    const resp = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream' },
      signal: _abortController.signal,
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + (await resp.text()));
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith(':')) continue;
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { payload = { _raw: data }; }
        handleEvent(event, payload);
      }
    }
    $status.innerHTML = '<span class="ok">finished</span>';
  } catch (e) {
    if (e.name !== 'AbortError') {
      $status.innerHTML = '<span class="err">' + (e.message || 'error') + '</span>';
      console.error(e);
    }
  } finally {
    clearInterval(_elapsedTimer);
    _firing = false;
    $fire.disabled = false;
    $sit.disabled = false;
  }
}

// Override Sit click to fire dialogue mode by default. Single-fire
// reflection mode is still reachable via `sit()` directly if needed.
$sit.removeEventListener('click', sit);
$sit.addEventListener('click', () => {
  const seed = $question.value.trim() || 'recent activity, what shape has this taken';
  dialogue(seed);
});


// ─── Proposals pane ──────────────────────────────────────────────────
// Polls the lake for kind:proposal tool:provenance deltas every 4s
// (and once immediately on load). Highlights the row with .fresh
// when a new id appears since the last poll. Clicking a row toggles
// an inline expansion showing summary + rationale + test questions.

const _seenProposalIds = new Set();
let _proposalsPolling = false;

async function fetchProposals() {
  if (_proposalsPolling) return;
  _proposalsPolling = true;
  try {
    // Fetch proposals + their decisions in parallel. Decisions live in
    // separate proposal-decision deltas tagged `decides:<proposal-id>`,
    // so we need to fold them in client-side to know which proposals
    // have been approved/denied.
    const [propsResp, decsResp] = await Promise.all([
      fetch('/v1/deltas?tags_include=' + encodeURIComponent('kind:proposal,tool:provenance') + '&limit=50',
        { headers: authHeaders() }),
      fetch('/v1/deltas?tags_include=' + encodeURIComponent('proposal-decision') + '&limit=200',
        { headers: authHeaders() }),
    ]);
    if (!propsResp.ok) return;
    const data = await propsResp.json();
    const items = Array.isArray(data) ? data : (data.results || data.deltas || []);
    let decisions = [];
    if (decsResp.ok) {
      const dd = await decsResp.json();
      decisions = Array.isArray(dd) ? dd : (dd.results || dd.deltas || []);
    }
    // proposal-id → most-recent decision status
    const decisionByProposal = new Map();
    for (const dec of decisions) {
      const tags = dec.tags || [];
      let proposalId = null, status = null;
      for (const t of tags) {
        if (typeof t !== 'string') continue;
        if (t.startsWith('decides:')) proposalId = t.slice(8);
        else if (t.startsWith('proposal-status:')) status = t.slice(16);
      }
      if (proposalId && status) {
        const prior = decisionByProposal.get(proposalId);
        if (!prior || (dec.timestamp || '') > (prior.ts || '')) {
          decisionByProposal.set(proposalId, { status, ts: dec.timestamp || '' });
        }
      }
    }
    renderProposals(items, decisionByProposal);
  } catch (e) {
    // soft-fail; keep last render
  } finally {
    _proposalsPolling = false;
  }
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

function renderProposals(items, decisionByProposal) {
  decisionByProposal = decisionByProposal || new Map();
  // Newest first.
  items.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));

  // Pull statuses for each item (separate from the delta itself —
  // the proposal-decision deltas carry decides:<id>). For simplicity
  // we don't fetch decisions inline in this poll; status is derived
  // from the proposal's own proposal-status:* tag if it changes.
  const fresh = [];
  for (const d of items) {
    if (d.id && !_seenProposalIds.has(d.id)) {
      _seenProposalIds.add(d.id);
      fresh.push(d.id);
    }
  }

  if (!items.length) {
    $proposalsList.innerHTML = '<div class="empty" style="padding:30px 0">No proposals yet. The harness can call propose_provenance during a fire.</div>';
    $proposalsCount.textContent = '—';
    return;
  }

  $proposalsCount.textContent = items.length + ' total';

  $proposalsList.innerHTML = '';
  for (const d of items) {
    let payload = {};
    try { payload = JSON.parse(d.content || '{}'); } catch { payload = {}; }
    const args = (payload.tool_args && typeof payload.tool_args === 'object') ? payload.tool_args : {};
    const tags = d.tags || [];
    const lvl = (function() {
      for (const t of tags) {
        if (typeof t === 'string' && t.startsWith('provenance-level:')) {
          return t.split(':', 2)[1];
        }
      }
      return '?';
    })();
    const producedBy = (function() {
      for (const t of tags) {
        if (typeof t === 'string' && t.startsWith('produced-by:')) return t.split(':', 2)[1];
      }
      return 'unknown';
    })();
    // Status: the proposal's own tag is always "pending" — the actual
    // decision lives in a separate proposal-decision delta. Prefer the
    // decision's status when one exists.
    const decision = decisionByProposal.get(d.id);
    const status = decision ? decision.status : (function() {
      for (const t of tags) {
        if (typeof t === 'string' && t.startsWith('proposal-status:')) {
          return t.split(':', 2)[1];
        }
      }
      return 'pending';
    })();
    const title = args.title || payload.title || '(untitled)';
    const summary = args.summary || payload.body || '';
    const rationale = args.rationale || payload.tail || '';
    const fromCount = (args.from_ids || []).length;
    const tq = args.test_questions || [];

    const row = el('div', { class: 'proposal-row status-' + status });
    if (fresh.includes(d.id)) row.classList.add('fresh');
    row.dataset.id = d.id;

    const head = el('div');
    const lvlBadge = el('span', { class: 'lvl', text: 'L' + lvl });
    head.appendChild(lvlBadge);
    head.appendChild(document.createTextNode(' '));
    const t = el('span', { class: 'title', text: title });
    head.appendChild(t);
    const src = el('span', { class: 'src', text: producedBy });
    head.appendChild(src);
    row.appendChild(head);

    if (summary) row.appendChild(el('div', { class: 'summary', text: summary }));

    const ts = (d.timestamp || '').slice(0, 19);
    const meta = el('div', { class: 'meta',
      text: `${fromCount} constituent${fromCount === 1 ? '' : 's'} · ${ts} · ${status}` });
    row.appendChild(meta);

    if (tq.length) {
      const det = el('details', { style: 'margin-top:6px' });
      det.appendChild(el('summary', { text: tq.length + ' test question' + (tq.length === 1 ? '' : 's') }));
      for (const q of tq) det.appendChild(el('div', { class: 'test-q', text: '· ' + q, style: 'font:11px/1.5 var(--mono); color:var(--text-dim); margin:2px 0' }));
      row.appendChild(det);
    }

    if (status === 'pending') {
      const actions = el('div', { class: 'proposal-actions' });
      const approveBtn = el('button', { class: 'approve', text: 'approve' });
      const denyBtn = el('button', { class: 'deny', text: 'deny' });
      approveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        decideProposal(d.id, 'approve', approveBtn, denyBtn);
      });
      denyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        decideProposal(d.id, 'deny', approveBtn, denyBtn);
      });
      actions.appendChild(approveBtn);
      actions.appendChild(denyBtn);
      row.appendChild(actions);
    }

    $proposalsList.appendChild(row);
  }
}

async function decideProposal(id, action, approveBtn, denyBtn) {
  if (!id) return;
  const url = `/v1/proposals/${encodeURIComponent(id)}/${action}`;
  approveBtn.disabled = true;
  denyBtn.disabled = true;
  const orig = action === 'approve' ? approveBtn : denyBtn;
  const origText = orig.textContent;
  orig.textContent = action === 'approve' ? 'approving…' : 'denying…';
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({}),
    });
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error('HTTP ' + resp.status + ': ' + txt.slice(0, 200));
    }
    // Optimistic: re-poll so the row's status flips and buttons disappear.
    await fetchProposals();
  } catch (e) {
    orig.textContent = origText;
    approveBtn.disabled = false;
    denyBtn.disabled = false;
    alert(`${action} failed: ${e.message || e}`);
  }
}

fetchProposals();
setInterval(fetchProposals, 4000);


</script>
