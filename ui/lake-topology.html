<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Topology — Fathom</title>
<style>
  :root {
    --bg: #0d0e10;
    --surface: #15171b;
    --surface-2: #1c1f24;
    --border: #2a2e36;
    --text: #e6e9ee;
    --text-dim: #8a93a0;
    --accent: #ffa552;
    --l0: #6e7785;       /* Q/A markers — soft gray */
    --l1: #6ec1e4;       /* episodes — blue */
    --l2: #b487e8;       /* topics — purple */
    --l3: #ffa552;       /* era — orange (accent) */
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase;
  }
  header .sub {
    color: var(--text-dim); font-size: 12px;
  }
  header .count {
    margin-left: auto;
    font: 12px/1 var(--mono);
    color: var(--text-dim);
  }
  header .count strong { color: var(--text); }
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 360px;
  }
  .canvas-wrap {
    overflow: hidden;
    position: relative;
    background: linear-gradient(180deg, #0d0e10 0%, #11141a 100%);
  }
  svg.topology { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.topology:active { cursor: grabbing; }
  .legend {
    position: absolute; top: 12px; left: 12px;
    background: rgba(21, 23, 27, 0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font: 12px/1.5 var(--mono);
    pointer-events: none;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .swatch {
    width: 12px; height: 12px;
    border-radius: 50%;
  }
  .timeline-axis {
    stroke: var(--border);
    stroke-width: 1;
  }
  .timeline-tick {
    fill: var(--text-dim);
    font: 11px/1 var(--mono);
  }
  .level-band {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
    stroke-dasharray: 2 4;
  }
  .level-label {
    fill: var(--text-dim);
    font: 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .node {
    cursor: pointer;
    stroke-width: 1;
  }
  .node.l0 { fill: var(--l0); stroke: var(--l0); }
  .node.l1 { fill: var(--l1); stroke: var(--l1); }
  .node.l2 { fill: var(--l2); stroke: var(--l2); }
  .node.l3 { fill: var(--l3); stroke: var(--l3); }
  .node:hover { fill-opacity: 1; stroke: #fff; stroke-width: 2; }
  .node.selected { fill-opacity: 1; stroke: #fff; stroke-width: 2.5; }
  .edge {
    fill: none;
    stroke: var(--border);
    stroke-opacity: 0.4;
    stroke-width: 0.6;
    pointer-events: none;
  }
  .edge.highlight {
    stroke: var(--accent);
    stroke-opacity: 0.9;
    stroke-width: 1.5;
  }

  aside.detail {
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px;
  }
  aside.detail .empty {
    color: var(--text-dim);
    padding: 30px 0;
    text-align: center;
    font-size: 13px;
  }
  aside.detail .level-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font: 600 10px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  aside.detail .level-pill.l0 { background: var(--l0); color: #0d0e10; }
  aside.detail .level-pill.l1 { background: var(--l1); color: #042033; }
  aside.detail .level-pill.l2 { background: var(--l2); color: #1a0a3a; }
  aside.detail .level-pill.l3 { background: var(--l3); color: #1a0d00; }
  aside.detail h2 {
    margin: 8px 0 4px;
    font-size: 16px;
    line-height: 1.3;
  }
  aside.detail .meta {
    font: 11px/1.5 var(--mono);
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  aside.detail .meta .field { display: inline-block; margin-right: 10px; }
  aside.detail .summary {
    color: var(--text);
    white-space: pre-wrap;
    margin-bottom: 12px;
  }
  aside.detail .label {
    font: 11px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 12px 0 4px;
  }
  aside.detail .test-q {
    font-style: italic;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  aside.detail ul {
    list-style: none;
    padding: 0; margin: 0;
  }
  aside.detail ul li {
    font: 11px/1.4 var(--mono);
    padding: 3px 0;
    color: var(--text-dim);
    cursor: pointer;
  }
  aside.detail ul li:hover { color: var(--accent); }
  .controls {
    position: absolute;
    bottom: 12px; left: 12px;
    display: flex; gap: 8px; align-items: center;
    font: 12px/1 var(--mono);
    color: var(--text-dim);
    background: rgba(21, 23, 27, 0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
  }
  .controls label { display: flex; align-items: center; gap: 4px; }
  .controls button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Lake Topology</h1>
    <span class="sub">provenance hierarchy across the lake — BIRTH on left, NOW on right</span>
    <span class="count" id="count">loading…</span>
  </header>

  <main>
    <div class="canvas-wrap">
      <svg class="topology" id="svg" preserveAspectRatio="none"></svg>
      <div class="legend">
        <div class="row"><span class="swatch" style="background:var(--l3)"></span> level 3 — era</div>
        <div class="row"><span class="swatch" style="background:var(--l2)"></span> level 2 — topic</div>
        <div class="row"><span class="swatch" style="background:var(--l1)"></span> level 1 — episode</div>
        <div class="row"><span class="swatch" style="background:var(--l0)"></span> level 0 — Q/A marker</div>
      </div>
      <div class="controls">
        <label><input type="checkbox" id="show-edges"> show parent edges</label>
        <label><input type="checkbox" id="show-l0" checked> include Q/A</label>
        <button id="reload">reload</button>
        <a href="/ui/lake-sketch.html" style="margin-left:auto;color:var(--text-dim);text-decoration:none;border-bottom:1px dashed var(--border);font-size:11px">↗ sketch view</a>
      </div>
    </div>
    <aside class="detail" id="detail">
      <div class="empty">Click a node to see its title, summary, constituents, and test questions.</div>
    </aside>
  </main>

<script>
const $svg = document.getElementById('svg');
const $detail = document.getElementById('detail');
const $count = document.getElementById('count');
const $showEdges = document.getElementById('show-edges');
const $showL0 = document.getElementById('show-l0');
const $reload = document.getElementById('reload');

let _allNodes = [];      // all provenance deltas, normalized
let _byId = new Map();   // id → node
let _selected = null;

function getToken() {
  try { return localStorage.getItem('fathom-api-key') || ''; } catch { return ''; }
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

async function fetchProvenance() {
  // Pull every kind:provenance delta. The /v1/deltas proxy splits
  // tags_include on commas before sending to delta-store, so a single
  // tag is fine here (all kind:provenance).
  const url = '/v1/deltas?tags_include=' +
    encodeURIComponent('kind:provenance') + '&limit=2000';
  const resp = await fetch(url, { headers: authHeaders() });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  const items = Array.isArray(data) ? data : (data.results || data.deltas || []);
  return items;
}

function levelFromTags(tags) {
  for (const t of (tags || [])) {
    if (t.startsWith('provenance-level:')) {
      const n = parseInt(t.split(':', 2)[1], 10);
      if (Number.isFinite(n)) return n;
    }
  }
  // Fallback: kind:qa-marker → level 0
  if ((tags || []).includes('kind:qa-marker')) return 0;
  return 1;
}

function fromIdsFromTags(tags) {
  const out = [];
  for (const t of (tags || [])) {
    if (t.startsWith('from:')) {
      const ref = t.slice('from:'.length).trim();
      if (ref) out.push(ref);
    }
  }
  return out;
}

function titleFromTags(tags, fallback) {
  for (const t of (tags || [])) {
    if (t.startsWith('title:')) {
      return t.slice('title:'.length).replace(/-/g, ' ');
    }
  }
  return fallback || '';
}

function parseTs(ts) {
  if (!ts) return 0;
  const d = new Date(ts);
  return Number.isFinite(d.getTime()) ? d.getTime() : 0;
}

function normalize(items) {
  const nodes = items.map(d => {
    const tags = d.tags || [];
    const fromIds = fromIdsFromTags(tags);
    const level = levelFromTags(tags);
    const ts = parseTs(d.timestamp);
    return {
      id: d.id,
      ts,
      level,
      tags,
      fromIds,
      source: d.source || '',
      title: titleFromTags(tags, '') || (d.content || '').split('\n')[0].slice(0, 80),
      content: d.content || '',
      isProposal: tags.includes('kind:proposal'),
    };
  }).filter(n => n.id);

  // Compute barycenter (median timestamp of children, recursively if
  // possible). For nodes whose children we have, use the median; else
  // fall back to the node's own write timestamp.
  const byId = new Map(nodes.map(n => [n.id, n]));
  // Two passes: first L0/L1 (no children among provenance, use write ts).
  // Then L2/L3 (children are provenance, use median of resolvable ones).
  for (const n of nodes) {
    if (n.level <= 1) {
      n.barycenter = n.ts;
      continue;
    }
    const childTs = n.fromIds
      .map(fid => byId.get(fid))
      .filter(Boolean)
      .map(c => c.barycenter || c.ts);
    if (childTs.length) {
      childTs.sort((a, b) => a - b);
      n.barycenter = childTs[Math.floor(childTs.length / 2)];
    } else {
      n.barycenter = n.ts;
    }
  }
  // L3 may need a second pass if its L2 children needed barycenter computed.
  for (const n of nodes) {
    if (n.level !== 3) continue;
    const childTs = n.fromIds
      .map(fid => byId.get(fid))
      .filter(Boolean)
      .map(c => c.barycenter || c.ts);
    if (childTs.length) {
      childTs.sort((a, b) => a - b);
      n.barycenter = childTs[Math.floor(childTs.length / 2)];
    }
  }
  return { nodes, byId };
}

function fmtDate(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toISOString().slice(0, 10);
}

function render() {
  const W = $svg.clientWidth || 1200;
  const H = $svg.clientHeight || 700;

  $svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const showL0 = $showL0.checked;
  const showEdges = $showEdges.checked;

  const visible = _allNodes.filter(n => showL0 || n.level > 0);

  if (!visible.length) {
    $svg.innerHTML = '';
    return;
  }

  // X scale: barycenter timestamps mapped across canvas with margins.
  const allTs = visible.map(n => n.barycenter).filter(Boolean);
  const tMin = Math.min(...allTs);
  const tMax = Math.max(...allTs);
  const xMargin = 50;
  const xRange = W - 2 * xMargin;
  const tx = ms => xMargin + ((ms - tMin) / Math.max(1, tMax - tMin)) * xRange;

  // Y by level — bands top to bottom: L3 (top), L2, L1, L0 (bottom).
  const yMargin = 50;
  const yBottom = H - 30;
  const yPerLevel = (yBottom - yMargin) / 4;
  const yBaseFor = lvl => yMargin + (3 - lvl) * yPerLevel + yPerLevel / 2;

  // Size by source-count (sqrt scaling so big nodes don't dominate)
  const radiusFor = n => {
    const k = n.fromIds.length;
    return 3 + Math.sqrt(k) * 1.6;
  };

  // Jitter Y within band so overlapping nodes don't pile up.
  function jitterY(n, bandY) {
    // Deterministic from id so jitter is stable across renders.
    let h = 0;
    for (const c of n.id) h = (h * 31 + c.charCodeAt(0)) & 0xfff;
    const j = ((h % 100) - 50) * 0.4;
    return bandY + j;
  }

  // Build SVG content.
  const parts = [];

  // Level bands.
  for (let lvl = 3; lvl >= 0; lvl--) {
    if (!showL0 && lvl === 0) continue;
    const y = yBaseFor(lvl);
    parts.push(
      `<line class="level-band" x1="${xMargin}" y1="${y}" x2="${W - xMargin}" y2="${y}" />`,
      `<text class="level-label" x="${xMargin}" y="${y - 8}">level ${lvl}${
        lvl === 0 ? ' — Q/A markers' :
        lvl === 1 ? ' — episodes' :
        lvl === 2 ? ' — topics' : ' — eras'
      }</text>`
    );
  }

  // Timeline axis.
  parts.push(
    `<line class="timeline-axis" x1="${xMargin}" y1="${yBottom}" x2="${W - xMargin}" y2="${yBottom}" />`,
    `<text class="timeline-tick" x="${xMargin}" y="${yBottom + 18}">${fmtDate(tMin)}  ◂ BIRTH</text>`,
    `<text class="timeline-tick" x="${W - xMargin}" y="${yBottom + 18}" text-anchor="end">NOW ▸  ${fmtDate(tMax)}</text>`,
  );

  // Month ticks across the axis.
  const monthMs = 30 * 24 * 60 * 60 * 1000;
  let tickT = Math.ceil(tMin / monthMs) * monthMs;
  while (tickT < tMax) {
    const x = tx(tickT);
    parts.push(
      `<line class="timeline-axis" x1="${x}" y1="${yBottom - 4}" x2="${x}" y2="${yBottom + 4}" stroke-opacity="0.5" />`,
      `<text class="timeline-tick" x="${x}" y="${yBottom + 18}" text-anchor="middle">${fmtDate(tickT).slice(2, 7)}</text>`
    );
    tickT += monthMs;
  }

  // Edges (parent → child curves).
  if (showEdges) {
    for (const n of visible) {
      const x1 = tx(n.barycenter);
      const y1 = jitterY(n, yBaseFor(n.level));
      for (const fid of n.fromIds) {
        const child = _byId.get(fid);
        if (!child) continue;
        if (!showL0 && child.level === 0) continue;
        const x2 = tx(child.barycenter || child.ts);
        const y2 = jitterY(child, yBaseFor(child.level));
        // Quadratic curve dipping toward the child's level.
        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        parts.push(
          `<path class="edge" data-parent="${n.id}" data-child="${fid}" d="M${x1},${y1} Q${cx},${cy + 8} ${x2},${y2}" />`
        );
      }
    }
  }

  // Nodes.
  for (const n of visible) {
    const x = tx(n.barycenter);
    const y = jitterY(n, yBaseFor(n.level));
    const r = radiusFor(n);
    const opacity = n.isProposal ? 0.4 : 0.85;
    parts.push(
      `<circle class="node l${n.level}${n.id === (_selected && _selected.id) ? ' selected' : ''}" ` +
      `cx="${x}" cy="${y}" r="${r}" fill-opacity="${opacity}" data-id="${n.id}" />`
    );
  }

  $svg.innerHTML = parts.join('\n');

  // Wire node clicks.
  for (const c of $svg.querySelectorAll('circle.node')) {
    c.addEventListener('click', e => {
      const id = c.dataset.id;
      const node = _byId.get(id);
      if (node) selectNode(node);
    });
  }
}

function selectNode(node) {
  _selected = node;
  // Re-render highlights edges + selected styling.
  if ($showEdges.checked) render();
  else {
    for (const c of $svg.querySelectorAll('circle.node.selected')) c.classList.remove('selected');
    const target = $svg.querySelector(`circle[data-id="${CSS.escape(node.id)}"]`);
    if (target) target.classList.add('selected');
  }
  renderDetail(node);
}

function renderDetail(node) {
  const tags = node.tags || [];
  const meta = (() => {
    let payload = {};
    try {
      const m = (node.content || '').match(/\[meta\]\s*({[\s\S]*})/);
      if (m) payload = JSON.parse(m[1]);
    } catch {}
    return payload;
  })();

  const summary = meta.summary || node.content || '';
  const testQs = Array.isArray(meta.test_questions) ? meta.test_questions : [];
  const rationale = meta.rationale || '';

  const childCount = node.fromIds.length;
  const parentCount = _allNodes.filter(p => p.fromIds.includes(node.id)).length;

  const childItems = node.fromIds.slice(0, 30).map(fid => {
    const child = _byId.get(fid);
    if (child) {
      return `<li data-id="${child.id}">${esc(child.title || fid)} <small>(L${child.level})</small></li>`;
    }
    return `<li><small>${esc(fid)}</small></li>`;
  }).join('');

  const proposalBadge = node.isProposal ? ' <span class="level-pill" style="background:#e57373;color:#2b0500">PROPOSAL</span>' : '';

  $detail.innerHTML = `
    <div>
      <span class="level-pill l${node.level}">L${node.level}</span>${proposalBadge}
    </div>
    <h2>${esc(node.title || '(untitled)')}</h2>
    <div class="meta">
      <span class="field">id: ${esc(node.id.slice(0, 12))}</span>
      <span class="field">source: ${esc(node.source)}</span>
      <span class="field">parents: ${parentCount}</span>
      <span class="field">children: ${childCount}</span>
      <span class="field">written: ${fmtDate(node.ts)}</span>
      ${node.barycenter !== node.ts ? `<span class="field">barycenter: ${fmtDate(node.barycenter)}</span>` : ''}
    </div>
    <div class="summary">${esc(summary)}</div>
    ${rationale ? `<div class="label">rationale</div><div class="summary" style="font-style:italic">${esc(rationale)}</div>` : ''}
    ${testQs.length ? `
      <div class="label">test questions</div>
      ${testQs.map(q => `<div class="test-q">· ${esc(q)}</div>`).join('')}
    ` : ''}
    ${childItems ? `
      <div class="label">constituents (${childCount})</div>
      <ul>${childItems}</ul>
    ` : ''}
  `;
  // Wire child clicks to navigate into them.
  for (const li of $detail.querySelectorAll('li[data-id]')) {
    li.addEventListener('click', () => {
      const child = _byId.get(li.dataset.id);
      if (child) selectNode(child);
    });
  }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function load() {
  $count.textContent = 'loading…';
  try {
    const items = await fetchProvenance();
    const { nodes, byId } = normalize(items);
    _allNodes = nodes;
    _byId = byId;
    const counts = nodes.reduce((acc, n) => { acc[n.level] = (acc[n.level] || 0) + 1; return acc; }, {});
    $count.innerHTML =
      `total <strong>${nodes.length}</strong> · ` +
      `L3 <strong>${counts[3] || 0}</strong> · ` +
      `L2 <strong>${counts[2] || 0}</strong> · ` +
      `L1 <strong>${counts[1] || 0}</strong> · ` +
      `L0 <strong>${counts[0] || 0}</strong>`;
    render();
  } catch (e) {
    $count.textContent = 'error: ' + (e.message || e);
    console.error(e);
  }
}

$showEdges.addEventListener('change', render);
$showL0.addEventListener('change', render);
$reload.addEventListener('click', load);
window.addEventListener('resize', render);

load();
</script>
</body>
</html>
